<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tvättkostnad — Prognos (tvätt2)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght=500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-bg: #2ecc71;
    --yellow-bg: #f1c40f;
    --red-bg: #e74c3c;
    --bg: #000000;
    --border: #333344;
    --text: #ffffff;
    --muted: #aaaaaa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px 12px;
  }
  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--border);
  }
  #title { 
    font-size: 16px; 
    font-weight: 700; 
    letter-spacing: 0.05em; 
    color: var(--muted);
  }
  #status-mode {
    font-size: 14px;
    padding-left: 8px;
    font-weight: 700;
  }
  #clock-digital { 
    font-size: 24px;
    color: #ffffff;
    font-weight: 700;
  }
  #chart-container {
    flex: 1;
    width: 100%;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .blink {
    animation: blinker 2s linear infinite;
  }
  @keyframes blinker {
    50% { opacity: 0.2; }
  }
</style>
</head>
<body>

<div id="header">
  <div id="title">TOTAL KOSTNAD FÖR 2H TVÄTT (1.0 kWh) <span id="status-mode">LADDAR...</span></div>
  <div id="clock-digital">—:—:—</div>
</div>

<div id="chart-container">
  <svg id="price-chart"></svg>
</div>

<script>
const SURCHARGE_ORE = 6.25;
const WASH_KWH = 1.0; 

// EXAKTA GRÄNSER I KRONOR
const GREEN_MAX_KR = 1.00;
const YELLOW_MAX_KR = 1.50;

function rawToOre(sek) { return sek * 100 * 1.25 + SURCHARGE_ORE; }
function padZ(n) { return n < 10 ? '0'+n : ''+n; }

function updateDigitalClock() {
  const now = new Date();
  document.getElementById('clock-digital').textContent =
    padZ(now.getHours())+':'+padZ(now.getMinutes())+':'+padZ(now.getSeconds());
}
setInterval(updateDigitalClock, 1000);
updateDigitalClock();

function getBgColor(totalWashCostKr) {
  if (totalWashCostKr < GREEN_MAX_KR) return 'var(--green-bg)';
  if (totalWashCostKr <= YELLOW_MAX_KR) return 'var(--yellow-bg)';
  return 'var(--red-bg)';
}

function drawChart(combinedPrices, isFallback) {
  const svg = document.getElementById('price-chart');
  const width = svg.clientWidth || window.innerWidth - 24;
  const height = svg.clientHeight || (window.innerHeight * 0.75);
  svg.innerHTML = '';

  const now = new Date();
  const startHour = now.getHours();
  const startMinute = now.getMinutes();
  const startTotalMinutes = startHour * 60 + startMinute;
  
  const maxHourInData = Math.max(...combinedPrices.map(p => p.hour), 23);
  const endTotalMinutes = (maxHourInData + 1) * 60; 
  const totalMinutesToDraw = endTotalMinutes - startTotalMinutes;

  if (totalMinutesToDraw <= 0) return;

  const dataPoints = [];
  let lowestPoint = { costKr: Infinity, index: -1 };
  
  for (let m = startTotalMinutes; m < endTotalMinutes; m++) {
    let totalOreSum = 0;
    let validMinutes = 0;

    for (let offset = 0; offset < 120; offset++) {
      const targetMinute = m + offset;
      let checkHour = Math.floor(targetMinute / 60);
      
      if (checkHour > maxHourInData) {
        checkHour = maxHourInData;
      }

      const price = combinedPrices.find(p => p.hour === checkHour)?.ore;
      if (price != null) {
        totalOreSum += price;
        validMinutes++;
      }
    }

    if (validMinutes > 0) {
      const avgPricePerKwhOre = totalOreSum / validMinutes;
      const totalWashCostKr = (avgPricePerKwhOre / 100) * WASH_KWH;
      const currentIdx = dataPoints.length;
      
      dataPoints.push({
        totalMinutes: m,
        hour: Math.floor(m / 60) % 24,
        fullHour: Math.floor(m / 60),
        minute: m % 60,
        costKr: totalWashCostKr
      });

      if (totalWashCostKr < lowestPoint.costKr) {
        lowestPoint.costKr = totalWashCostKr;
        lowestPoint.index = currentIdx;
      }
    }
  }

  if (dataPoints.length === 0) return;

  const padding = { top: 55, right: 20, bottom: 45, left: 95 }; 
  const graphWidth = width - padding.left - padding.right;
  const graphHeight = height - padding.top - padding.bottom;

  const validCosts = dataPoints.map(p => p.costKr);
  const maxCost = Math.max(...validCosts, 2.50); 
  const minCost = Math.min(...validCosts, 0);
  const costRange = maxCost - minCost || 1;

  function getX(index) { return padding.left + (index / dataPoints.length) * graphWidth; }
  function getY(costKr) { return padding.top + graphHeight - ((costKr - minCost) / costRange) * graphHeight; }

  const ns = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs, txt) {
    const el = document.createElementNS(ns, tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
  }

  if (isFallback) {
    const defs = mk('defs', {});
    const pattern = mk('pattern', {
      id: 'fallback-hatch', width: '20', height: '20', patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'
    });
    pattern.appendChild(mk('line', { x1: '0', y1: '0', x2: '0', y2: '20', stroke: 'rgba(0,0,0,0.15)', 'stroke-width': '4' }));
    defs.appendChild(pattern);
    svg.appendChild(defs);
  }

  // 1. Bakgrundsfält
  dataPoints.forEach((p, idx) => {
    if (idx === dataPoints.length - 1) return;
    const xStart = getX(idx);
    const xEnd = getX(idx + 1);
    const w = xEnd - xStart + 0.5;
    const bgFill = getBgColor(p.costKr);

    svg.appendChild(mk('rect', {
      x: xStart, y: padding.top, width: w, height: graphHeight, fill: bgFill
    }));

    if (isFallback) {
      svg.appendChild(mk('rect', {
        x: xStart, y: padding.top, width: w, height: graphHeight, fill: 'url(#fallback-hatch)'
      }));
    }
  });

  // 2. Tidsaxeln i botten
  let lastLabeledHour = -1;
  dataPoints.forEach((p, idx) => {
    if (p.minute === 0 && p.hour !== lastLabeledHour) {
      const xPos = getX(idx);
      svg.appendChild(mk('line', {
        x1: xPos, y1: padding.top, x2: xPos, y2: padding.top + graphHeight, stroke: 'rgba(0,0,0,0.15)', 'stroke-width': 1
      }));
      
      let labelText = padZ(p.hour);
      if (p.fullHour === 24) labelText = "Morgon";
      
      svg.appendChild(mk('text', {
        x: xPos, y: padding.top + graphHeight + 32, 'text-anchor': 'middle', fill: '#ffffff', 'font-size': '16px', 'font-weight': '700'
      }, labelText));
      lastLabeledHour = p.hour;
    }
  });

  // 3. Horisontella linjer och Y-axeln
  const gridLevels = 4;
  for (let i = 0; i <= gridLevels; i++) {
    const targetCost = minCost + (costRange / gridLevels) * i;
    const yStr = getY(targetCost);
    
    svg.appendChild(mk('line', {
      x1: padding.left, y1: yStr, x2: width - padding.right, y2: yStr, stroke: 'rgba(0, 0, 0, 0.25)', 'stroke-width': 2, 'stroke-dasharray': '4 4'
    }));

    svg.appendChild(mk('text', {
      x: padding.left - 15, y: yStr + 6, 'text-anchor': 'end', fill: '#ffffff', 'font-size': '16px', 'font-weight': '700'
    }, targetCost.toFixed(2) + ' kr'));
  }

  // 4. Priskurvan
  let pathD = '';
  dataPoints.forEach((p, idx) => {
    const x = getX(idx);
    const y = getY(p.costKr);
    pathD += (idx === 0 ? 'M' : 'L') + `${x} ${y}`;
  });

  svg.appendChild(mk('path', { d: pathD, fill: 'none', stroke: '#000000', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  svg.appendChild(mk('path', { d: pathD, fill: 'none', stroke: '#ffffff', 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));

  // 5. Optimal starttid-etikett & Beräkning av Delay End
  if (lowestPoint.index !== -1) {
    const optPoint = dataPoints[lowestPoint.index];
    const optX = getX(lowestPoint.index);
    const optY = getY(optPoint.costKr);

    svg.appendChild(mk('circle', { cx: optX, cy: optY, r: 5, fill: '#ffffff', stroke: '#000000', 'stroke-width': 2 }));

    const textY = optY < padding.top + 30 ? optY + 25 : optY - 15;
    const labelText = `OPTIMAL START: ${padZ(optPoint.hour)}:${padZ(optPoint.minute)} (${optPoint.costKr.toFixed(2)} kr)`;
    const approxWidth = labelText.length * 9.5;

    svg.appendChild(mk('rect', {
      x: optX - approxWidth / 2 - 6, y: textY - 14, width: approxWidth + 12, height: 20, fill: '#000000', rx: 4, opacity: 0.85
    }));

    svg.appendChild(mk('text', {
      x: optX, y: textY, 'text-anchor': 'middle', fill: '#ffffff', 'font-size': '13px', 'font-weight': '700', 'letter-spacing': '0.05em'
    }, labelText));

    // Delay End-instruktion högst upp i diagrammet
    const diffMinutes = optPoint.totalMinutes - startTotalMinutes;
    const diffHoursTotal = diffMinutes / 60;
    
    let delayInstruction = "";
    if (diffHoursTotal < 0.5) {
      delayInstruction = "STARTA TVÄTTEN DIREKT!";
    } else {
      const delayHours = Math.round(diffHoursTotal + 2);
      delayInstruction = `STÄLL DELAY END PÅ ${delayHours} H`;
    }

    const centerX = padding.left + graphWidth / 2;
    svg.appendChild(mk('text', {
      x: centerX,
      y: padding.top - 20,
      'text-anchor': 'middle',
      fill: '#ffffff',
      'font-size': '22px',
      'font-weight': '700',
      'letter-spacing': '0.05em'
    }, delayInstruction));
  }

  // 6. Indikator för NU
  const currentX = padding.left;
  svg.appendChild(mk('line', { x1: currentX, y1: padding.top - 8, x2: currentX, y2: padding.top + graphHeight, stroke: '#ffffff', 'stroke-width': 3, 'stroke-dasharray': '4 2' }));
  svg.appendChild(mk('polygon', { points: `${currentX},${padding.top} ${currentX-8},${padding.top - 10} ${currentX+8},${padding.top - 10}`, fill: '#ffffff' }));
}

window._combinedPrices = [];
window._isFallbackActive = false;

function generateFallbackData() {
  const list = [];
  const todayMock = [120, 110, 100, 95, 110, 140, 190, 240, 230, 210, 180, 150, 130, 120, 110, 130, 190, 250, 270, 240, 210, 170, 140, 110];
  const tomorrowMock = [110, 100, 90, 85, 95, 120, 170, 210, 200, 180, 150, 130, 110, 100, 95, 110, 160, 210, 230, 200, 170, 140, 120, 100];
  
  todayMock.forEach((ore, h) => list.push({ hour: h, ore: ore }));
  tomorrowMock.forEach((ore, h) => list.push({ hour: 24 + h, ore: ore }));
  return list;
}

async function fetchPrices() {
  const now = new Date();
  const fmt = d => `${d.getFullYear()}/${padZ(d.getMonth()+1)}-${padZ(d.getDate())}`;
  const base = 'https://www.elprisetjustnu.se/api/v1/prices/';

  let todayData = [];
  let tomorrowData = [];
  let hasToday = false;
  let hasTomorrow = false;

  // 1. Hämta ALLTID IDAG
  try {
    const rToday = await fetch(base + fmt(now) + '_SE3.json');
    if (rToday.ok) {
      todayData = await rToday.json();
      hasToday = true;
    }
  } catch(e) { console.error("Fel vid lokal fetch för idag:", e); }

  // 2. SMART TIDSKONTROLL: Fråga bara efter imorgon om klockan slagit 13:15 (Slipper 404 i loggen!)
  const currentHour = now.getHours();
  const currentMinute = now.getMinutes();
  const timeAsMinutes = currentHour * 60 + currentMinute;
  const targetReleaseMinutes = 13 * 60 + 15;

  if (timeAsMinutes >= targetReleaseMinutes) {
    const tomorrowDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
    try {
      const rTomorrow = await fetch(base + fmt(tomorrowDate) + '_SE3.json');
      if (rTomorrow.ok) {
        tomorrowData = await rTomorrow.json();
        hasTomorrow = true;
      }
    } catch(e) { /* Fångas tyst */ }
  }

  let combined = [];
  const statusEl = document.getElementById('status-mode');

  if (!hasToday || todayData.length === 0) {
    combined = generateFallbackData();
    window._isFallbackActive = true;
    statusEl.textContent = '(SE3 - DEMODATA / CORS-FALLBACK)';
    statusEl.style.color = 'var(--red-bg)';
    statusEl.className = 'blink';
  } else {
    window._isFallbackActive = false;
    statusEl.textContent = hasTomorrow ? '(SE3 - REALA PRISER + IMORGON)' : '(SE3 - REALA PRISER)';
    statusEl.style.color = 'var(--green-bg)';
    statusEl.className = '';
    
    todayData.forEach(p => {
      const h = new Date(p.time_start).getHours();
      combined.push({ hour: h, ore: rawToOre(p.SEK_per_kWh) });
    });

    if (hasTomorrow && tomorrowData.length > 0) {
      tomorrowData.forEach(p => {
        const h = new Date(p.time_start).getHours();
        combined.push({ hour: 24 + h, ore: rawToOre(p.SEK_per_kWh) }); 
      });
    }
  }

  window._combinedPrices = combined;
  drawChart(combined, window._isFallbackActive);
}

fetchPrices();
setInterval(fetchPrices, 15 * 60 * 1000);
setInterval(() => {
  if (window._combinedPrices.length > 0) drawChart(window._combinedPrices, window._isFallbackActive);
}, 60000);

window.addEventListener('resize', () => {
  if (window._combinedPrices.length > 0) drawChart(window._combinedPrices, window._isFallbackActive);
});
</script>
</body>
</html>
