<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tvättstugan — Elpris</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2ecc6e;
    --yellow: #f5c842;
    --red: #f04848;
    --bg: #0e0e12;
    --surface: #18181f;
    --border: #2a2a35;
    --text: #e8e8f0;
    --muted: #6b6b80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-columns: 190px 1fr;
    height: 100vh;
  }

  /* LEFT */
  #left-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    gap: 8px;
  }
  #status-label {
    font-family: 'Playfair Display', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  #traffic-light-housing {
    background: #111116;
    border: 2px solid #2a2a35;
    border-radius: 30px;
    padding: 7px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow: 0 0 28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .tl-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    transition: all 0.6s ease;
  }
  .tl-dot.off { background: #1e1e26; }
  .tl-dot.on-red {
    background: radial-gradient(circle at 35% 35%, #ff7070, var(--red));
    box-shadow: 0 0 18px var(--red), 0 0 36px rgba(240,72,72,0.35);
  }
  .tl-dot.on-yellow {
    background: radial-gradient(circle at 35% 35%, #ffe090, var(--yellow));
    box-shadow: 0 0 18px var(--yellow), 0 0 36px rgba(245,200,66,0.35);
  }
  .tl-dot.on-green {
    background: radial-gradient(circle at 35% 35%, #80ffb0, var(--green));
    box-shadow: 0 0 18px var(--green), 0 0 36px rgba(46,204,110,0.35);
  }

  #current-price-display { text-align: center; }
  #current-price-num {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    transition: color 0.6s ease;
  }
  #current-price-unit {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.1em; margin-top: 2px;
  }

  #wash-window-info {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
    width: 100%;
  }
  #wash-window-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
  #wash-window-time { font-size: 13px; font-weight: 500; }
  #wash-window-price { font-size: 12px; color: var(--muted); margin-top: 1px; }

  #clock-digital { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }

  /* RIGHT */
  #right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 10px 8px;
    gap: 6px;
  }
  #clock-svg { display: block; filter: drop-shadow(0 0 24px rgba(0,0,0,0.6)); }

  #legend {
    display: flex; gap: 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
</style>
</head>
<body>

<div id="left-panel">
  <div id="status-label">Nu kostar det</div>
  <div id="traffic-light-housing">
    <div class="tl-dot off" id="tl-red"></div>
    <div class="tl-dot off" id="tl-yellow"></div>
    <div class="tl-dot off" id="tl-green"></div>
  </div>
  <div id="current-price-display">
    <div id="current-price-num" class="pulse">—</div>
    <div id="current-price-unit">kr / kWh (inkl. moms)</div>
  </div>
  <div id="wash-window-info">
    <div id="wash-window-label">🧺 Bästa start</div>
    <div id="wash-window-time">Laddar…</div>
    <div id="wash-window-price"></div>
  </div>
  <div id="clock-digital">—</div>
</div>

<div id="right-panel">
  <svg id="clock-svg"></svg>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Under 1 kr</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>1–1,20 kr</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Över 1,20 kr</div>
  </div>
</div>

<script>
const SURCHARGE_ORE = 6.25;
const GREEN_MAX = 80, YELLOW_MAX = 120;

function rawToOre(sek) { return sek * 100 * 1.25 + SURCHARGE_ORE; }
function oreToKr(ore) { return Math.round(ore / 100 * 10) / 10; } // one decimal, whole-ish
function oreToDisplay(ore) { return Math.round(ore / 100) + ' kr'; } // whole kronor for labels
function getColor(ore) {
  if (ore < GREEN_MAX) return '#2ecc6e';
  if (ore <= YELLOW_MAX) return '#f5c842';
  return '#f04848';
}
function padZ(n) { return n < 10 ? '0'+n : ''+n; }

function updateDigitalClock() {
  const now = new Date();
  document.getElementById('clock-digital').textContent =
    padZ(now.getHours())+':'+padZ(now.getMinutes())+':'+padZ(now.getSeconds());
}
setInterval(updateDigitalClock, 1000);
updateDigitalClock();

function setTrafficLight(ore) {
  ['tl-red','tl-yellow','tl-green'].forEach(id =>
    document.getElementById(id).className = 'tl-dot off');
  const cls = ore < GREEN_MAX ? 'on-green' : ore <= YELLOW_MAX ? 'on-yellow' : 'on-red';
  const id = {
    'on-green':'tl-green','on-yellow':'tl-yellow','on-red':'tl-red'
  }[cls];
  document.getElementById(id).className = 'tl-dot ' + cls;
  const num = document.getElementById('current-price-num');
  num.textContent = oreToDisplay(ore);
  num.style.color = getColor(ore);
  num.classList.remove('pulse');
}

function drawClock(hourPrices) {
  const svg = document.getElementById('clock-svg');
  const panel = document.getElementById('right-panel');
  const availH = panel.clientHeight - 40;
  const availW = panel.clientWidth - 20;
  // We need extra room outside the ring for labels, so shrink inner size
  const maxFit = Math.min(availW, availH);
  const size = Math.max(180, Math.min(maxFit * 0.72, 290));
  const labelGap = 46;
  const totalSvgSize = size + labelGap * 2;

  svg.setAttribute('width', totalSvgSize);
  svg.setAttribute('height', totalSvgSize);
  svg.innerHTML = '';

  const cx = totalSvgSize / 2;
  const cy = totalSvgSize / 2;
  const outerR = size / 2;
  const innerR = outerR * 0.22;
  const labelR = outerR + labelGap - 5;

  const ns = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs, txt) {
    const el = document.createElementNS(ns, tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
  }

  function polar(angleDeg, r) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function sectorPath(h, r1, r2) {
    // each hour = 15deg
    const a0 = h * 15, a1 = (h + 1) * 15 - 0.4; // small gap
    const s1 = polar(a0, r2), e1 = polar(a1, r2);
    const s2 = polar(a1, r1), e2 = polar(a0, r1);
    const lg = (a1 - a0) > 180 ? 1 : 0;
    return `M${s1.x} ${s1.y} A${r2} ${r2} 0 ${lg} 1 ${e1.x} ${e1.y} L${s2.x} ${s2.y} A${r1} ${r1} 0 ${lg} 0 ${e2.x} ${e2.y} Z`;
  }

  const now = new Date();
  const currentHour = now.getHours();

  // Outer background ring (so label area is dark too)
  svg.appendChild(mk('circle', { cx, cy, r: outerR + labelGap, fill: '#0e0e12' }));
  // Main face bg
  svg.appendChild(mk('circle', { cx, cy, r: outerR, fill: '#16161e', stroke: '#2a2a35', 'stroke-width': 1.5 }));

  // Draw 24 sectors
  hourPrices.forEach(({ hour, ore, hasData }) => {
    const midAngle = hour * 15 + 7.5;
    const isPast = hour < currentHour;
    const color = hasData ? getColor(ore) : '#2a2a35';
    const op = isPast ? 0.22 : 1.0;

    // Sector fill
    svg.appendChild(mk('path', {
      d: sectorPath(hour, innerR + 1, outerR - 1),
      fill: color,
      opacity: op,
      stroke: '#0e0e12',
      'stroke-width': 0.8
    }));

    // Hour label OUTSIDE ring (rotated along edge)
    const lp = polar(midAngle, labelR);
    const hfs = Math.max(10, size * 0.055);
    svg.appendChild(mk('text', {
      x: lp.x, y: lp.y,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      fill: isPast ? '#2e2e3a' : '#9090a8',
      'font-size': hfs,
      'font-family': 'DM Mono, monospace',
      'font-weight': '500',
      transform: `rotate(${midAngle}, ${lp.x}, ${lp.y})`
    }, padZ(hour)));

    // Price label INSIDE sector
    if (hasData && !isPast) {
      const hp = polar(midAngle, (innerR + outerR) / 2);
      const fs = Math.max(8, size * 0.038);
      svg.appendChild(mk('text', {
        x: hp.x, y: hp.y,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        fill: 'rgba(0,0,0,0.75)',
        'font-size': fs,
        'font-family': 'DM Mono, monospace',
        'font-weight': '500'
      }, Math.round(ore / 100) + ''));
    }
  });

  // Inner cap
  svg.appendChild(mk('circle', { cx, cy, r: innerR, fill: '#0e0e12', stroke: '#2a2a35', 'stroke-width': 1 }));

  // Best wash window highlight (dashed white arc)
  const bh = window._bestHour;
  if (bh !== undefined) {
    const a0 = bh * 15, a1 = a0 + 22.5; // 1.5h
    const s1 = polar(a0, outerR - 2), e1 = polar(a1, outerR - 2);
    const s2 = polar(a1, innerR + 2), e2 = polar(a0, innerR + 2);
    svg.appendChild(mk('path', {
      d: `M${s1.x} ${s1.y} A${outerR-2} ${outerR-2} 0 0 1 ${e1.x} ${e1.y} L${s2.x} ${s2.y} A${innerR+2} ${innerR+2} 0 0 0 ${e2.x} ${e2.y} Z`,
      fill: 'none',
      stroke: 'rgba(255,255,255,0.75)',
      'stroke-width': 2,
      'stroke-dasharray': '4 3'
    }));
    // 🧺 emoji in the sector
    const bMid = a0 + 11.25;
    const bp = polar(bMid, (innerR + outerR) / 2);
    svg.appendChild(mk('text', {
      x: bp.x, y: bp.y,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': size * 0.038
    }, '🧺'));
  }

  // Clock hand — points to current time
  const nowAngle = currentHour * 15 + (now.getMinutes() / 60) * 15;
  const tip = polar(nowAngle, outerR - 3);
  svg.appendChild(mk('line', {
    x1: cx, y1: cy, x2: tip.x, y2: tip.y,
    stroke: '#ffffff', 'stroke-width': 2.5,
    'stroke-linecap': 'round', opacity: 0.9
  }));
  svg.appendChild(mk('circle', { cx, cy, r: 4.5, fill: '#ffffff', opacity: 0.9 }));
}

// Store last data for redraws
window._hourPrices = null;
window._bestHour = undefined;

async function fetchPrices() {
  const now = new Date();
  const fmt = d => `${d.getFullYear()}/${padZ(d.getMonth()+1)}-${padZ(d.getDate())}`;
  const base = 'https://www.elprisetjustnu.se/api/v1/prices/';

  let today = [];
  try {
    const r = await fetch(base + fmt(now) + '_SE3.json');
    if (r.ok) today = await r.json();
  } catch(e) { console.error('Fetch error', e); }

  const hourMap = {};
  today.forEach(p => {
    const h = new Date(p.time_start).getHours();
    hourMap[h] = rawToOre(p.SEK_per_kWh);
  });

  const hourPrices = Array.from({length:24}, (_, h) => ({
    hour: h, ore: hourMap[h] ?? null, hasData: hourMap[h] != null
  }));

  window._hourPrices = hourPrices;

  const currentHour = now.getHours();
  const currentOre = hourPrices[currentHour]?.ore;
  if (currentOre != null) setTrafficLight(currentOre);

  // Best 1.5h window
  let bestIdx = -1, bestAvg = Infinity;
  for (let h = currentHour; h <= 22; h++) {
    const a = hourPrices[h].ore, b = hourPrices[h+1]?.ore;
    if (a == null || b == null) continue;
    const avg = (a + b * 0.5) / 1.5;
    if (avg < bestAvg) { bestAvg = avg; bestIdx = h; }
  }

  window._bestHour = bestIdx >= 0 ? bestIdx : undefined;

  if (bestIdx >= 0) {
    const et = new Date(); et.setHours(bestIdx, 0, 0, 0);
    const ef = new Date(et.getTime() + 90*60000);
    document.getElementById('wash-window-time').textContent =
      padZ(et.getHours())+':00 – '+padZ(ef.getHours())+':'+padZ(ef.getMinutes());
    const avgOre = Math.round(bestAvg);
    document.getElementById('wash-window-price').textContent = Math.round(avgOre / 100) + ' kr/kWh';
    document.getElementById('wash-window-price').style.color = getColor(avgOre);
  }

  drawClock(hourPrices);
}

fetchPrices();
setInterval(fetchPrices, 15 * 60 * 1000);

// Redraw clock hand every minute
setInterval(() => {
  if (window._hourPrices) drawClock(window._hourPrices);
}, 60000);

window.addEventListener('resize', () => {
  if (window._hourPrices) drawClock(window._hourPrices);
});
</script>
</body>
</html>
