<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chokladhjulet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400&display=swap');

  :root {
    --choc-dark: #3b1f0a;
    --choc-mid: #6b3a1f;
    --choc-light: #c8824a;
    --choc-cream: #f5e6d0;
    --choc-gold: #d4a853;
    --choc-text: #1a0d04;
    --shadow: rgba(30,10,0,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--choc-dark);
    background-image:
      radial-gradient(ellipse at 20% 20%, #5a2d10 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #4a1e08 0%, transparent 55%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    padding: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--choc-gold);
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0.04em;
    text-shadow: 0 2px 12px var(--shadow);
    margin-bottom: 8px;
    text-align: center;
  }

  .subtitle {
    color: var(--choc-cream);
    opacity: 0.6;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 36px;
    text-align: center;
  }

  /* WHEEL WRAPPER */
  .wheel-scene {
    position: relative;
    width: 320px;
    height: 320px;
    margin-bottom: 40px;
  }

  /* Decorative ring */
  .wheel-scene::before {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: conic-gradient(
      var(--choc-gold) 0deg 10deg,
      var(--choc-mid) 10deg 20deg,
      var(--choc-gold) 20deg 30deg,
      var(--choc-mid) 30deg 40deg,
      var(--choc-gold) 40deg 50deg,
      var(--choc-mid) 50deg 60deg,
      var(--choc-gold) 60deg 70deg,
      var(--choc-mid) 70deg 80deg,
      var(--choc-gold) 80deg 90deg,
      var(--choc-mid) 90deg 100deg,
      var(--choc-gold) 100deg 110deg,
      var(--choc-mid) 110deg 120deg,
      var(--choc-gold) 120deg 130deg,
      var(--choc-mid) 130deg 140deg,
      var(--choc-gold) 140deg 150deg,
      var(--choc-mid) 150deg 160deg,
      var(--choc-gold) 160deg 170deg,
      var(--choc-mid) 170deg 180deg,
      var(--choc-gold) 180deg 190deg,
      var(--choc-mid) 190deg 200deg,
      var(--choc-gold) 200deg 210deg,
      var(--choc-mid) 210deg 220deg,
      var(--choc-gold) 220deg 230deg,
      var(--choc-mid) 230deg 240deg,
      var(--choc-gold) 240deg 250deg,
      var(--choc-mid) 250deg 260deg,
      var(--choc-gold) 260deg 270deg,
      var(--choc-mid) 270deg 280deg,
      var(--choc-gold) 280deg 290deg,
      var(--choc-mid) 290deg 300deg,
      var(--choc-gold) 300deg 310deg,
      var(--choc-mid) 310deg 320deg,
      var(--choc-gold) 320deg 330deg,
      var(--choc-mid) 330deg 340deg,
      var(--choc-gold) 340deg 350deg,
      var(--choc-mid) 350deg 360deg
    );
    box-shadow: 0 0 40px var(--shadow), inset 0 0 20px rgba(0,0,0,0.3);
    z-index: 0;
  }

  canvas#wheel {
    position: relative;
    z-index: 1;
    border-radius: 50%;
    box-shadow: 0 8px 40px var(--shadow);
    cursor: pointer;
    transition: filter 0.3s;
  }

  canvas#wheel:hover:not(.disabled) {
    filter: brightness(1.08);
  }

  canvas#wheel.disabled {
    cursor: not-allowed;
    opacity: 0.85;
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: 50%;
    right: -28px;
    transform: translateY(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 34px solid var(--choc-gold);
    filter: drop-shadow(-3px 0 6px rgba(0,0,0,0.5));
  }

  /* Center hub */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f5e6d0, #8b5c2a);
    border: 3px solid var(--choc-gold);
    z-index: 5;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  /* Result banner */
  #result {
    min-height: 60px;
    text-align: center;
    transition: all 0.5s ease;
  }

  .result-label {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--choc-gold);
    text-shadow: 0 2px 10px var(--shadow);
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .result-sub {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--choc-cream);
    opacity: 0.55;
    margin-top: 4px;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Spin button */
  #spinBtn {
    margin-top: 24px;
    padding: 14px 44px;
    background: linear-gradient(135deg, var(--choc-gold) 0%, #b8872a 100%);
    color: var(--choc-dark);
    border: none;
    border-radius: 4px;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
  }

  #spinBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  #spinBtn:active:not(:disabled) {
    transform: translateY(0);
  }

  #spinBtn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    transform: none;
  }

  /* Admin section */
  .admin-area {
    margin-top: 32px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .admin-area input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(212,168,83,0.35);
    border-radius: 4px;
    padding: 10px 14px;
    color: var(--choc-cream);
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    width: 160px;
  }

  .admin-area input::placeholder { opacity: 0.4; }
  .admin-area input:focus { border-color: var(--choc-gold); }

  .admin-area button {
    padding: 10px 18px;
    background: transparent;
    border: 1px solid rgba(212,168,83,0.5);
    border-radius: 4px;
    color: var(--choc-gold);
    font-family: 'Lato', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .admin-area button:hover {
    background: rgba(212,168,83,0.12);
    border-color: var(--choc-gold);
  }

  .admin-msg {
    margin-top: 8px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-align: center;
    min-height: 18px;
    color: var(--choc-light);
    text-transform: uppercase;
  }

  .lock-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--choc-cream);
    opacity: 0.5;
    margin-top: 12px;
  }

  .lock-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e74c3c;
  }

  .lock-dot.unlocked { background: #2ecc71; }

  /* Confetti-ish sparkle layer */
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 1.4rem;
    animation: fall 1.8s ease-in forwards;
    z-index: 100;
  }

  @keyframes fall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<h1>🍫 Chokladhjulet</h1>
<p class="subtitle">Snurra hjulet — ödet väljer</p>

<div class="wheel-scene">
  <canvas id="wheel" width="320" height="320"></canvas>
  <div class="pointer"></div>
  <div class="hub"></div>
</div>

<div id="result"></div>

<button id="spinBtn">Snurra hjulet</button>

<div class="lock-status">
  <div class="lock-dot" id="lockDot"></div>
  <span id="lockText">Låst — en snurr kvar</span>
</div>

<div class="admin-area">
  <input type="password" id="adminPass" placeholder="Admin-lösenord" autocomplete="off">
  <button onclick="adminUnlock()">Lås upp</button>
</div>
<div class="admin-msg" id="adminMsg"></div>

<script>
  // ── CONFIG ───────────────────────────────────────────────
  const SEGMENTS = [
    { label: "23 september", color: "#6b3a1f", text: "#f5e6d0" },
    { label: "7 oktober",    color: "#c8824a", text: "#1a0d04" },
  ];
  const STORAGE_KEY = "chokladhjul_spun";
  // ────────────────────────────────────────────────────────

  const canvas   = document.getElementById("wheel");
  const ctx      = canvas.getContext("2d");
  const spinBtn  = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const lockDot  = document.getElementById("lockDot");
  const lockText = document.getElementById("lockText");
  const adminMsg = document.getElementById("adminMsg");

  let currentAngle = 0;
  let spinning = false;
  let hasSpun = localStorage.getItem(STORAGE_KEY) === "true";

  // Draw wheel
  function drawWheel(angle) {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r  = cx - 4;
    const n  = SEGMENTS.length;
    const arc = (Math.PI * 2) / n;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    SEGMENTS.forEach((seg, i) => {
      const start = angle + i * arc - Math.PI / 2;
      const end   = start + arc;

      // Slice
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();

      // Subtle inner highlight
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
      grad.addColorStop(0, "rgba(255,255,255,0.08)");
      grad.addColorStop(1, "rgba(0,0,0,0.18)");
      ctx.fillStyle = grad;
      ctx.fill();

      // Divider line
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + r * Math.cos(start), cy + r * Math.sin(start));
      ctx.strokeStyle = "rgba(212,168,83,0.6)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = seg.text;
      ctx.font = "bold 17px 'Playfair Display', serif";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 4;
      ctx.fillText(seg.label, r - 18, 6);
      ctx.restore();
    });

    // Outer rim
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(212,168,83,0.7)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  drawWheel(currentAngle);
  updateUI();

  function updateUI() {
    if (hasSpun) {
      spinBtn.disabled = true;
      canvas.classList.add("disabled");
      lockDot.classList.remove("unlocked");
      lockText.textContent = "Låst — snurren är använd";
    } else {
      spinBtn.disabled = false;
      canvas.classList.remove("disabled");
      lockDot.classList.add("unlocked");
      lockText.textContent = "Upplåst — en snurr kvar";
    }
  }

  function spin() {
    if (spinning || hasSpun) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.innerHTML = "";

    // Determine random winner
    const winner = Math.floor(Math.random() * SEGMENTS.length);
    const arc = (Math.PI * 2) / SEGMENTS.length;

    // Target: pointer is at right (0°), segment center lands there
    // Segment i spans: i*arc to (i+1)*arc (offset by -π/2 for vertical start)
    // We want: angle + i*arc + arc/2 - π/2 = 0  (mod 2π)
    // => angle = π/2 - i*arc - arc/2
    const targetOffset = Math.PI / 2 - winner * arc - arc / 2;
    const extraSpins = (5 + Math.floor(Math.random() * 5)) * Math.PI * 2;
    const totalRotation = extraSpins + ((targetOffset - currentAngle % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2));
    const finalAngle = currentAngle + totalRotation;

    const duration = 4500 + Math.random() * 1000;
    const start = performance.now();
    const startAngle = currentAngle;

    function ease(t) {
      // Cubic ease-out
      return 1 - Math.pow(1 - t, 3);
    }

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      currentAngle = startAngle + (finalAngle - startAngle) * ease(t);
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        currentAngle = finalAngle;
        drawWheel(currentAngle);
        spinning = false;
        hasSpun = true;
        localStorage.setItem(STORAGE_KEY, "true");
        updateUI();
        showResult(SEGMENTS[winner].label);
        spawnSparkles();
      }
    }

    requestAnimationFrame(frame);
  }

  function showResult(label) {
    resultEl.innerHTML = `
      <div class="result-label">🎉 ${label}</div>
      <div class="result-sub">Ödet har talat</div>
    `;
  }

  function spawnSparkles() {
    const emojis = ["✨","🍫","⭐","🌟","💫","🎊","🍬"];
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const el = document.createElement("div");
        el.className = "sparkle";
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = "-40px";
        el.style.animationDuration = (1.2 + Math.random() * 1.2) + "s";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }, i * 120);
    }
  }

  async function adminUnlock() {
    const pw = document.getElementById("adminPass").value.trim();
    if (!pw) return;

    const btn = document.querySelector(".admin-area button");
    btn.disabled = true;
    adminMsg.style.color = "var(--choc-gold)";
    adminMsg.textContent = "Verifierar…";

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 10,
          system: `You are a password checker. The secret admin password is "choklad2024". 
The user will send a password attempt. Reply with only the single word CORRECT if it matches exactly, or WRONG if it does not. No other text.`,
          messages: [{ role: "user", content: pw }]
        })
      });

      const data = await response.json();
      const answer = (data.content?.[0]?.text || "").trim().toUpperCase();

      if (answer === "CORRECT") {
        hasSpun = false;
        localStorage.removeItem(STORAGE_KEY);
        resultEl.innerHTML = "";
        updateUI();
        adminMsg.textContent = "✓ Upplåst — ny snurr tillåten";
        adminMsg.style.color = "#2ecc71";
        document.getElementById("adminPass").value = "";
        setTimeout(() => adminMsg.textContent = "", 3000);
      } else {
        adminMsg.textContent = "✗ Fel lösenord";
        adminMsg.style.color = "#e74c3c";
        setTimeout(() => adminMsg.textContent = "", 2500);
      }
    } catch (err) {
      adminMsg.textContent = "✗ Nätverksfel — försök igen";
      adminMsg.style.color = "#e74c3c";
      setTimeout(() => adminMsg.textContent = "", 3000);
    } finally {
      btn.disabled = false;
    }
  }

  spinBtn.addEventListener("click", spin);

  document.getElementById("adminPass").addEventListener("keydown", e => {
    if (e.key === "Enter") adminUnlock();
  });
</script>
</body>
</html>
