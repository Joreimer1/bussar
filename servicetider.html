<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Servicedagar karta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* KONFIGURATION: byt dessa två */
const API_KEY = "bdbc0530-408c-4ac0-8ad4-bcda19d40d6e";
const WORKER_URL = "https://gentle-unit-77d4.johan-oestberg.workers.dev"; // utan trailing slash
const BASE = "https://openparking.stockholm.se/LTF-Tolken/v1";

/* Initiera karta */
const map = L.map('map').setView([59.33, 18.06], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/* Hjälp: bygg proxylänk säkert */
function proxyUrl(target) {
  const base = WORKER_URL.replace(/\/+$/, "");
  return `${base}/?target=${encodeURIComponent(target)}`;
}

/* Ladda lokal GeoJSON med geometrier (streets.geojson) */
function loadLocalGeoJSON() {
  fetch('streets.geojson')
    .then(r => {
      if (!r.ok) throw new Error('Kunde inte ladda streets.geojson');
      return r.json();
    })
    .then(geojson => {
      L.geoJSON(geojson, {
        style: { color: '#2b7cff', weight: 4 },
        onEachFeature: (feature, layer) => {
          const name = feature.properties?.StreetName || feature.properties?.name || "Okänd gata";
          layer.bindPopup(`<strong>${name}</strong><br/>Klick för servicedagar`);
          layer.on('click', () => fetchStreetData(name, layer));
        }
      }).addTo(map);
    })
    .catch(err => {
      console.error(err);
      alert('Kunde inte ladda lokala geometrier. Lägg streets.geojson i samma repo.');
    });
}

/* Hämta servicedagar för en gata via Worker, med enkel caching */
function fetchStreetData(streetName, layer) {
  const cacheKey = `sd:${streetName}`;
  const cached = sessionStorage.getItem(cacheKey);
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      if (Date.now() - parsed.ts < 10 * 60 * 1000) {
        showStreetPopup(streetName, parsed.data, layer);
        return;
      }
    } catch {}
  }

  const targetUrl = `${BASE}/servicedagar/street/${encodeURIComponent(streetName)}?outputFormat=json&apiKey=${API_KEY}`;
  const url = proxyUrl(targetUrl);
  console.log('Proxy fetch:', url);

  fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } })
    .then(res => {
      console.log('Worker status:', res.status);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data }));
      showStreetPopup(streetName, data, layer);
    })
    .catch(err => {
      console.error('fetchStreetData error:', err);
      layer.setPopupContent(`<strong>${streetName}</strong><br/>Kunde inte hämta servicedagar`).openPopup();
    });
}

function showStreetPopup(streetName, streetData, layer) {
  if (!Array.isArray(streetData) || streetData.length === 0) {
    layer.setPopupContent(`<strong>${streetName}</strong><br/>Inga servicedagar hittades`).openPopup();
    return;
  }
  let html = `<strong>${streetName}</strong><br/>`;
  streetData.forEach(sd => {
    const day = sd.Weekday ?? "";
    const start = sd.StartTime ?? "";
    const end = sd.EndTime ?? "";
    html += `Dag: ${day}<br/>Tid: ${start}–${end}<br/><br/>`;
  });
  layer.setPopupContent(html).openPopup();
}

/* Starta: ladda lokala geometrier */
loadLocalGeoJSON();
</script>
</body>
</html>
