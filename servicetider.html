<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Servicedagar — klick på gata</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* KONFIGURATION: byt dessa två */
const API_KEY = "bdbc0530-408c-4ac0-8ad4-bcda19d40d6e";
const WORKER_URL = "https://gentle-unit-77d4.johan-oestberg.workers.dev"; // utan trailing slash
const BASE = "https://openparking.stockholm.se/LTF-Tolken/v1";

/* Initiera karta */
const map = L.map('map').setView([59.33, 18.06], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/* Hjälp: bygg proxylänk säkert */
function proxyUrl(target) {
  const base = WORKER_URL.replace(/\/+$/, "");
  return `${base}/?target=${encodeURIComponent(target)}`;
}

/* Haversine avstånd i meter */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = v => v * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* Hitta närmaste feature i array med features som API:t returnerar */
function findNearestInArray(features, lat, lon) {
  let best = null, bestDist = Infinity;
  if (!Array.isArray(features)) return null;

  for (const f of features) {
    // Försök flera vanliga platser för geometri
    const geom = f.geometry || f.Geometry || f.properties?.geometry || f.properties?.Geometry;
    if (!geom || !geom.type || !geom.coordinates) continue;

    const lines = geom.type === 'Point' ? [[geom.coordinates]] :
                  geom.type === 'LineString' ? [geom.coordinates] :
                  geom.type === 'MultiLineString' ? geom.coordinates : [];

    for (const line of lines) {
      for (const c of line) {
        // c förväntas vara [lon, lat]
        const lon2 = c[0], lat2 = c[1];
        if (typeof lat2 !== 'number' || typeof lon2 !== 'number') continue;
        const d = haversine(lat, lon, lat2, lon2);
        if (d < bestDist) { bestDist = d; best = f; }
      }
    }
  }
  return best ? { feature: best, distance: bestDist } : null;
}

/* Cache per gatunamn för att minska anrop */
const streetCache = new Map();

/* Klickhanterare: reverse geocode -> anropa servicedagar/street -> välj närmaste segment */
let clickTimeout = null;
const CLICK_DEBOUNCE_MS = 250;

map.on('click', (e) => {
  if (clickTimeout) clearTimeout(clickTimeout);
  clickTimeout = setTimeout(() => handleMapClick(e.latlng), CLICK_DEBOUNCE_MS);
});

async function handleMapClick(latlng) {
  const lat = latlng.lat, lon = latlng.lng;
  const popup = L.popup().setLatLng([lat, lon]).setContent("Hämtar gatunamn...").openOn(map);

  try {
    // Reverse geocode via Nominatim för att få ett användarvänligt gatunamn
    const nomUrl = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&addressdetails=1`;
    const nomRes = await fetch(nomUrl, {
      headers: { "Accept": "application/json", "User-Agent": "github.com/yourrepo - contact" }
    });
    if (!nomRes.ok) throw new Error(`Nominatim HTTP ${nomRes.status}`);
    const nomJson = await nomRes.json();
    const addr = nomJson.address || {};
    const streetName = addr.road || addr.pedestrian || addr.cycleway || addr.footway || addr.residential || addr.street;
    if (!streetName) {
      popup.setContent("Kunde inte hitta gatunamn här");
      return;
    }

    popup.setContent(`<strong>${streetName}</strong><br/>Hämtar servicedagar...`);

    // Cachekoll
    if (streetCache.has(streetName)) {
      const cached = streetCache.get(streetName);
      const nearest = findNearestInArray(cached, lat, lon);
      if (nearest) {
        showFeaturePopup(nearest.feature, [lat, lon]);
        return;
      }
      showFeatureListPopup(streetName, cached, [lat, lon]);
      return;
    }

    // Anropa Worker för just den gatan
    const target = `${BASE}/servicedagar/street/${encodeURIComponent(streetName)}?outputFormat=json&apiKey=${API_KEY}`;
    const workerUrl = proxyUrl(target);
    console.log("Proxy fetch:", workerUrl);

    const res = await fetch(workerUrl, { headers: { "Accept": "application/json" } });
    const text = await res.text();
    if (!res.ok) {
      console.error("Upstream error:", res.status, text);
      popup.setContent(`<strong>${streetName}</strong><br/>Kunde inte hämta servicedagar (HTTP ${res.status})`);
      return;
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.error("Invalid JSON from worker:", text.slice(0,500));
      popup.setContent(`<strong>${streetName}</strong><br/>Felaktigt svar från server`);
      return;
    }

    // Normalisera: API kan returnera FeatureCollection eller array
    const features = (data && data.type === 'FeatureCollection' && Array.isArray(data.features)) ? data.features
                    : Array.isArray(data) ? data
                    : (Array.isArray(data.features) ? data.features : []);

    streetCache.set(streetName, features);

    if (!features.length) {
      popup.setContent(`<strong>${streetName}</strong><br/>Inga servicedagar hittades för gatan`);
      return;
    }

    // Om flera poster: välj närmaste
    const nearest = findNearestInArray(features, lat, lon);
    if (nearest) {
      showFeaturePopup(nearest.feature, [lat, lon]);
    } else {
      showFeatureListPopup(streetName, features, [lat, lon]);
    }
  } catch (err) {
    console.error("handleMapClick error:", err);
    L.popup().setLatLng([lat, lon]).setContent('Fel vid hämtning av gatunamn eller servicedagar').openOn(map);
  }
}

/* Visa popup med en features servicedagar */
function showFeaturePopup(feature, latlng) {
  const props = feature.properties || feature;
  const street = props.StreetName || props.STREET_NAME || props.streetName || 'Okänd gata';
  const address = props.ADDRESS || props.Address || '';
  const weekday = props.START_WEEKDAY || props.Weekday || props.STARTDAY || '';
  const start = props.START_TIME || props.StartTime || '';
  const end = props.END_TIME || props.EndTime || '';
  let html = `<strong>${street}</strong><br/>${address}<br/><br/>`;
  if (weekday || start || end) html += `Dag: ${weekday}<br/>Tid: ${start}${start && end ? '–' : ''}${end}<br/><br/>`;
  if (props.CITATION) html += `Beslut: ${props.CITATION}<br/>`;
  if (props.VALID_FROM) html += `Giltig från: ${props.VALID_FROM}<br/>`;
  L.popup().setLatLng(latlng).setContent(html).openOn(map);
}

/* Visa lista om flera segment hittades */
function showFeatureListPopup(streetName, features, latlng) {
  let html = `<strong>${streetName}</strong><br/>Flera segment hittades:<br/><br/>`;
  features.forEach((f, i) => {
    const p = f.properties || f;
    html += `${i+1}. ${p.ADDRESS || p.Address || ''} — ${p.START_WEEKDAY || p.Weekday || ''}<br/>`;
  });
  L.popup().setLatLng(latlng).setContent(html).openOn(map);
}

/* Enkel knapp för att rensa cache i sessionen (utveckling) */
function clearCache() {
  streetCache.clear();
  sessionStorage.removeItem('streetCache');
  console.log('Cache rensad');
}

/* Exponera clearCache i fönstret för snabb felsökning i devtools */
window.clearServicedagarCache = clearCache;
</script>
</body>
</html>
