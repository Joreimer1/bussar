  :root {
    --bg: #080c12;
    --panel: #101820;
    --panel-border: #1e2e3e;
    --amber: #ff9900;
    --teal: #00e8bb;
    --teal-mid: #00a880;
    --red: #ff5050;
    --red-mid: #cc2020;
    --label: #8aa0b0;
    --badge-bg: #1a2535;
    --badge-text: #c8d8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    justify-content: center;
  }

  .screen {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 18px 14px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── CLOCK CARD ── */
  .clock-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-top: 2px solid #3a2200;
    border-radius: 14px;
    padding: 12px 20px 12px;
    position: relative;
  }
  .clock-card-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .weather-icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weather-icon {
    font-size: 48px;
    line-height: 1;
    opacity: 1;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    user-select: none;
  }
  .weather-icon.pulse { animation: wi-pulse 4s ease-in-out infinite; }
  @keyframes wi-pulse {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(255,200,50,0.25)); }
    50%       { filter: drop-shadow(0 0 28px rgba(255,200,50,0.6));  }
  }

  .clock-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 130%, rgba(255,153,0,0.05) 0%, transparent 65%);
    pointer-events: none;
  }

  .card-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--label);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .led-time {
    font-family: 'DSEG7', monospace;
    font-weight: bold;
    font-size: 56px;
    color: var(--amber);
    letter-spacing: 0.04em;
    text-shadow:
      0 0 6px rgba(255,153,0,1),
      0 0 22px rgba(255,153,0,0.55),
      0 0 55px rgba(255,153,0,0.18);
    line-height: 1;
  }

  .led-colon {
    animation: blink 1s step-end infinite;
    display: inline-block;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.08; }
  }

  /* ── WEATHER ROW ── */
  .weather-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .weather-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-top: 2px solid var(--teal-mid);
    border-radius: 14px;
    padding: 10px 16px 10px;
    position: relative;
  }
  .weather-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 130%, rgba(0,232,187,0.04) 0%, transparent 65%);
    pointer-events: none;
  }

  .weather-value {
    font-family: 'DSEG7', monospace;
    font-weight: bold;
    font-size: 38px;
    color: var(--teal);
    line-height: 1;
    text-shadow:
      0 0 6px rgba(0,232,187,0.9),
      0 0 22px rgba(0,232,187,0.35);
    letter-spacing: 0.04em;
  }
  .weather-unit {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--teal-mid);
    margin-left: 4px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 2px 0;
  }
  .section-header-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--label);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--panel-border), transparent);
  }

  /* ── BUS LIST ── */
  .bus-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .bus-row {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 14px 10px 14px;
    display: flex;
    align-items: center;
    position: relative;
  }

  .bus-row::before {
    content: '';
    position: absolute;
    left: 0; top: 15%; bottom: 15%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--teal-mid);
  }

  .bus-row.urgent {
    background: #000000;
    border-color: rgba(255,80,80,0.3);
  }
  .bus-row.urgent::before {
    background: var(--red);
    box-shadow: 0 0 10px rgba(255,80,80,0.7);
  }

  /* Badge */
  .bus-badge {
    width: 52px;
    height: 52px;
    background: var(--badge-bg);
    border: 1px solid #2a3d52;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bus-row.urgent .bus-badge {
    background: #1a0000;
    border-color: rgba(255,80,80,0.4);
  }
  .bus-number {
    font-family: 'DSEG7', monospace;
    font-weight: bold;
    font-size: 22px;
    color: var(--badge-text);
    letter-spacing: 0.02em;
  }
  .bus-row.urgent .bus-number {
    color: var(--red);
    text-shadow: 0 0 8px rgba(255,80,80,0.7);
  }

  /* Time area — pushed right but with right margin so not flush */
  .bus-time-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding-right: 18px;
  }

  /* Tabular display: fixed-width columns for each digit/colon */
  .bus-digits {
    display: grid;
    /* wider columns so digits don't crowd each other */
    grid-template-columns: 30px 30px 18px 30px 30px;
    align-items: center;
    direction: ltr;
  }

  .d {
    font-family: 'DSEG7', monospace;
    font-weight: bold;
    font-size: 36px;
    color: var(--teal);
    text-shadow:
      0 0 6px rgba(0,232,187,0.8),
      0 0 20px rgba(0,232,187,0.3);
    line-height: 1;
    text-align: center;
  }
  .bus-row.urgent .d {
    color: var(--red);
    text-shadow:
      0 0 6px rgba(255,80,80,0.9),
      0 0 20px rgba(255,80,80,0.4);
  }
  .d-colon {
    font-family: 'DSEG7', monospace;
    font-weight: bold;
    font-size: 36px;
    color: var(--teal);
    text-shadow:
      0 0 6px rgba(0,232,187,0.8),
      0 0 20px rgba(0,232,187,0.3);
    line-height: 1;
    text-align: center;
  }
  .bus-row.urgent .d-colon {
    color: var(--red);
    text-shadow:
      0 0 6px rgba(255,80,80,0.9),
      0 0 20px rgba(255,80,80,0.4);
  }
  .d-empty {
    /* empty cell for single-digit minutes */
  }

  .bus-min-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--teal-mid);
    letter-spacing: 0.06em;
    align-self: flex-end;
    padding-bottom: 4px;
  }
  .bus-row.urgent .bus-min-label {
    color: var(--red-mid);
  }

  .bus-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal-mid);
    flex-shrink: 0;
    opacity: 0.7;
    margin-left: 10px;
  }
  .bus-row.urgent .bus-dot {
    background: var(--red);
    box-shadow: 0 0 8px rgba(255,80,80,0.9);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.25; transform: scale(0.55); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.05) 0px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>
<div class="screen">

  <div class="clock-card">
    <div class="clock-card-inner">
      <div>
        <div class="card-label">Lokal tid</div>
        <div class="led-time" id="clock-time">--<span class="led-colon">:</span>--</div>
      </div>
      <div class="weather-icon-wrap">
        <div id="weather-icon" class="weather-icon">⏳</div>
      </div>
    </div>
  </div>

  <div class="weather-row">
    <div class="weather-card">
      <div class="card-label">Temperatur</div>
      <div class="weather-value" id="weather-temp">--<span class="weather-unit">°C</span></div>
    </div>
    <div class="weather-card">
      <div class="card-label">Vind</div>
      <div class="weather-value" id="weather-wind">--<span class="weather-unit">m/s</span></div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-header-text">Avgångar</div>
    <div class="section-line"></div>
  </div>

  <div class="bus-list" id="departures"></div>

</div>
<script>

        let allDepartures = [];
        let lastFetchTime = null;

        async function getSlDepartures(siteId) {
            try {
                const response = await fetch(`https://transport.integration.sl.se/v1/sites/${siteId}/departures`);
                const data = await response.json();
                
                const departures = [];
                
                data.departures.forEach(departure => {
                    if (departure.direction_code === 2) {
                        departures.push(departure);
                    }
                });
                
                return departures;
            } catch (error) {
                console.error('Fel vid hämtning av data:', error);
                return [];
            }
        }

        function formatTimeRemaining(expectedTime) {
            const now = new Date();
            const expected = new Date(expectedTime);
            const diffMs = expected - now;
            
            if (diffMs <= 0) {
                return null;
            }
            
            const totalSeconds = Math.floor(diffMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            const secStr = seconds < 10 ? '0' + seconds : seconds;
            
            return `${minutes} min ${secStr} sek`;
        }

        async function fetchDepartures() {
            let departures1300 = await getSlDepartures(1300);
            const departures1301 = await getSlDepartures(1301);

            // Filtrera bort buss 66 från 1301
            departures1300 = departures1300.filter(d => d.line.id !== 57);
            
            allDepartures = [...departures1300, ...departures1301];
            allDepartures.sort((a, b) => new Date(a.expected) - new Date(b.expected));
            lastFetchTime = new Date();
        }

        function updateDisplay() {
            // Update clock
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock-time').innerHTML =
                h + '<span class="led-colon">:</span>' + m;

            let html = '';

            allDepartures.forEach(departure => {
                const timeRemaining = formatTimeRemaining(departure.expected);
                if (!timeRemaining) return;

                const busNumber = departure.line.id;
                const expected = new Date(departure.expected);
                const diffMs = expected - now;
                const totalMinutes = Math.floor(diffMs / 60000);
                const totalSeconds = Math.floor(diffMs / 1000);
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                const isUrgent = totalMinutes <= 2;
                const urgentClass = isUrgent ? ' urgent' : '';

                // Format minutes as two digits with leading empty cell if single digit
                const minsStr = mins.toString();
                const d1 = minsStr.length === 1 ? '<span class="d d-empty"></span>' : `<span class="d">${minsStr[0]}</span>`;
                const d2 = `<span class="d">${minsStr.length === 1 ? minsStr[0] : minsStr[1]}</span>`;
                const s1 = `<span class="d">${Math.floor(secs / 10)}</span>`;
                const s2 = `<span class="d">${secs % 10}</span>`;

                html += `
                    <div class="bus-row${urgentClass}">
                        <div class="bus-badge"><span class="bus-number">${busNumber}</span></div>
                        <div class="bus-time-area">
                            <div class="bus-digits">
                                ${d1}${d2}
                                <span class="d-colon">:</span>
                                ${s1}${s2}
                            </div>
                            <span class="bus-min-label">MIN</span>
                        </div>
                        <div class="bus-dot"></div>
                    </div>`;
            });

            if (html === '') {
                html = '<div class="bus-row"><div class="bus-badge"><span class="bus-number">-</span></div><div class="bus-time-area"><span class="bus-min-label">Inga avgångar</span></div></div>';
            }

            document.getElementById('departures').innerHTML = html;
        }

        async function fetchWeather() {
            try {
                const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.3293&longitude=18.0686&current=temperature_2m,wind_speed_10m&wind_speed_unit=ms');
                const data = await resp.json();
                const temp = Math.round(data.current.temperature_2m);
                const wind = Math.round(data.current.wind_speed_10m);
                document.getElementById('weather-temp').innerHTML = temp + '<span class="weather-unit">°C</span>';
                document.getElementById('weather-wind').innerHTML = wind + '<span class="weather-unit">m/s</span>';
            } catch (e) {
                console.error('Väder fel:', e);
            }
        }

        function wmoToEmoji(code) {
            if (code === 0)                 return { e: '☀️',  pulse: true  };
            if (code <= 2)                  return { e: '🌤️',  pulse: true  };
            if (code === 3)                 return { e: '☁️',  pulse: false };
            if (code === 45 || code === 48) return { e: '🌫️',  pulse: false };
            if (code <= 57)                 return { e: '🌦️',  pulse: false };
            if (code <= 67)                 return { e: '🌧️',  pulse: false };
            if (code <= 77)                 return { e: '❄️',  pulse: false };
            if (code <= 82)                 return { e: '🌦️',  pulse: false };
            if (code <= 86)                 return { e: '🌨️',  pulse: false };
            if (code >= 95)                 return { e: '⛈️',  pulse: false };
            return { e: '❓', pulse: false };
        }

        async function fetchWeatherIcon() {
            const el = document.getElementById('weather-icon');
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.3075&longitude=18.0810&current=weathercode&models=best_match');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const code = data.current.weathercode;
                const sym = wmoToEmoji(code);
                el.textContent = sym.e;
                if (sym.pulse) el.classList.add('pulse');
            } catch (err) {
                el.textContent = '❓';
                console.error('Väderikon fel:', err.message, err);
            }
        }

        async function init() {
            await fetchDepartures();
            updateDisplay();
            fetchWeather();
            
            setInterval(updateDisplay, 1000);
            setInterval(fetchDepartures, 60000);
            setInterval(fetchWeather, 600000);
            fetchWeatherIcon();
            setInterval(fetchWeatherIcon, 600000);
        }

        init();
    
</script>
</body>
</html>
</html>
