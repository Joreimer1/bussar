<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0d1b2a; overflow: hidden;
  }
  #icon {
    font-size: min(60vw, 60vh); line-height: 1;
    opacity: 0; transition: opacity 0.6s ease;
    filter: drop-shadow(0 0 40px rgba(255,255,255,0.15));
    user-select: none;
  }
  #icon.visible { opacity: 1; }
  #icon.pulse { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(255,200,50,0.25)); }
    50%       { filter: drop-shadow(0 0 60px rgba(255,200,50,0.5));  }
  }
</style>
</head>
<body>
<div id="icon">⏳</div>
<script>
  // Open-Meteo – Norra Hammarbyhamnen (har öppet CORS, ingen API-nyckel)
  const LAT = 59.3075;
  const LON = 18.0810;
  const URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=weathercode&models=best_match`;

  // WMO-koder → emoji
  function wmoToEmoji(code) {
    if (code === 0)                 return { e: '☀️',  pulse: true  };
    if (code <= 2)                  return { e: '🌤️',  pulse: true  };
    if (code === 3)                 return { e: '☁️',  pulse: false };
    if (code === 45 || code === 48) return { e: '🌫️',  pulse: false };
    if (code <= 57)                 return { e: '🌦️',  pulse: false };
    if (code <= 67)                 return { e: '🌧️',  pulse: false };
    if (code <= 77)                 return { e: '❄️',  pulse: false };
    if (code <= 82)                 return { e: '🌦️',  pulse: false };
    if (code <= 86)                 return { e: '🌨️',  pulse: false };
    if (code >= 95)                 return { e: '⛈️',  pulse: false };
    return { e: '❓', pulse: false };
  }

  async function fetchWeather() {
    const el = document.getElementById('icon');
    try {
      const res = await fetch(URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const code = data.current.weathercode;
      const sym = wmoToEmoji(code);
      el.textContent = sym.e;
      if (sym.pulse) el.classList.add('pulse');
      el.classList.add('visible');
    } catch (err) {
      el.textContent = '❓';
      el.classList.add('visible');
      console.error('Fetch failed:', err);
    }
  }

  fetchWeather();
</script>
</body>
</html>
