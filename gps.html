<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Walking Coverage — Gatuandelar (Inspelning)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{font-family:Arial, sans-serif;margin:0;padding:14px;background:#f3f5f8;display:flex;flex-direction:column;align-items:center}
    h1{margin:0 0 12px;color:#222}
    #controls{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{padding:8px 14px;border:0;border-radius:6px;background:#007bff;color:#fff;cursor:pointer}
    button.secondary{background:#6c757d}
    button.danger{background:#dc3545}
    button.success{background:#28a745}
    #map{width:100%;max-width:1000px;height:640px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);cursor:crosshair}
    #info{width:100%;max-width:1000px;margin-top:12px;background:white;padding:12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
    #info h2{margin:0 0 8px;font-size:16px}
    #list{max-height:220px;overflow:auto;margin:8px 0;padding:0;list-style:none}
    #list li{padding:6px 8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
    .bar{height:8px;background:#e9ecef;border-radius:6px;overflow:hidden;flex:1;margin-left:12px;margin-right:12px}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,#28a745,#82e0a8)}
    .small{font-size:13px;color:#555}
    .tracks{margin-top:8px}
    .track-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #f0f0f0}
    .track-actions button{margin-left:6px;padding:6px 8px;font-size:13px}
    .debug { font-size:12px;color:#666;margin-left:8px }
  </style>
</head>
<body>
  <h1>Walking Coverage — Gator i stadsdelen (Inspelning)</h1>

  <div id="controls">
    <button id="loadStreetsBtn">Ladda gator för vy</button>
    <button id="analyzeBtn" class="secondary">Analysera täckning</button>
    <button id="resetBtn" class="danger">Rensa allt</button>
    <button id="centerBtn" class="secondary">Centrera på rutten</button>

    <button id="startRecBtn" class="success">Starta inspelning</button>
    <button id="stopRecBtn" class="secondary" disabled>Stoppa inspelning</button>
    <button id="saveRecBtn" class="secondary" disabled>Spara sträcka</button>

    <label class="debug"><input type="checkbox" id="debugChk"> Debug</label>
  </div>

  <div id="map"></div>

  <div id="info">
    <h2>Sammanfattning</h2>
    <div id="summary" class="small">Inget ännu. Ladda gator för området, spela in promenader och analysera.</div>

    <h2>Inspelade sträckor</h2>
    <div id="tracksContainer" class="tracks small"></div>

    <h2>Gatunivå (topplista)</h2>
    <ul id="list"></ul>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
/* ---------- Konfiguration ---------- */
const DENSIFY_M = 4;
const SAMPLE_STEP_M = 1;
const PROXIMITY_M = 12;
const GRID_CELL_DEG = 0.0012;
const MERGED_SLACK_M = 0.5;

/* ---------- Leaflet setup ---------- */
const map = L.map('map').setView([59.3326, 18.0649], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);

/* ---------- Global state ---------- */
let streetSegments = [];
let gridIndex = null;
let streetBaseLayer = L.layerGroup().addTo(map);
let coveredLayer = L.layerGroup().addTo(map);
let recordedTracks = loadTracksFromStorage(); // array of {id, name, coords:[[lat,lon],...], startTs, endTs, lengthMeters}
let currentTrack = null; // {coords, startTs}
let watchId = null;
let trackLayerGroup = L.layerGroup().addTo(map);

/* ---------- Hjälpfunktioner ---------- */
function calculateDistanceLatLng(a,b){ return L.latLng(a[0],a[1]).distanceTo(L.latLng(b[0],b[1])); }

function densifyLine(points, maxDistM){
  if(!points || points.length<2) return points?points.slice():[];
  const out = [];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    out.push(a);
    const dist = calculateDistanceLatLng(a,b);
    if(dist > maxDistM){
      const steps = Math.ceil(dist / maxDistM);
      for(let s=1;s<steps;s++){
        const t = s / steps;
        out.push([ a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t ]);
      }
    }
  }
  out.push(points[points.length-1]);
  return out;
}

/* ---------- Grid-index ---------- */
function buildGridIndex(segments, cellSizeDeg = GRID_CELL_DEG){
  const grid = new Map();
  segments.forEach(seg=>{
    const [minLat,minLon,maxLat,maxLon] = seg.bbox;
    const r0 = Math.floor(minLat/cellSizeDeg), r1=Math.floor(maxLat/cellSizeDeg);
    const c0 = Math.floor(minLon/cellSizeDeg), c1=Math.floor(maxLon/cellSizeDeg);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
      const k = `${r},${c}`;
      if(!grid.has(k)) grid.set(k, []);
      grid.get(k).push(seg.id);
    }
  });
  return {grid, cellSizeDeg};
}
function queryGrid(gridIndex, lat, lon, extCells=2){
  const {grid, cellSizeDeg} = gridIndex;
  const rr = Math.floor(lat / cellSizeDeg), cc = Math.floor(lon / cellSizeDeg);
  const ids = new Set();
  for(let r=rr-extCells;r<=rr+extCells;r++){
    for(let c=cc-extCells;c<=cc+extCells;c++){
      const k = `${r},${c}`;
      const list = grid.get(k);
      if(list) list.forEach(id=>ids.add(id));
    }
  }
  return Array.from(ids);
}

/* ---------- Segment bygg ---------- */
function buildSegmentsFromWays(geojson, densifyM = DENSIFY_M){
  const segments = [];
  let segId = 0;
  geojson.features.forEach((feat, wi) => {
    if(!feat.geometry || feat.geometry.type !== 'LineString') return;
    const coords = feat.geometry.coordinates.map(c => [c[1], c[0]]);
    const densified = densifyLine(coords, densifyM);
    for(let i=0;i<densified.length-1;i++){
      const a = densified[i], b = densified[i+1];
      const len = calculateDistanceLatLng(a,b);
      const bbox = [ Math.min(a[0],b[0]), Math.min(a[1],b[1]), Math.max(a[0],b[0]), Math.max(a[1],b[1]) ];
      segments.push({
        id: segId++,
        wayId: feat.properties && (feat.properties['@id'] || feat.properties.osm_id || feat.id) ? (feat.properties['@id'] || feat.properties.osm_id || feat.id) : wi,
        name: (feat.properties && (feat.properties.name || feat.properties['name:sv'])) || (feat.properties && feat.properties.highway) || "unnamed",
        coords: [a,b],
        lengthMeters: len,
        bbox,
        visitedMeters: [],
        coveredMeters: 0,
        coveredFraction: 0,
        _mergedIntervals: []
      });
    }
  });
  return segments;
}

/* ---------- Sampling path (används för analyser) ---------- */
function samplePath(rawPath, stepM = SAMPLE_STEP_M){
  const out = [];
  if(!rawPath || rawPath.length < 2) return out;
  for(let i=0;i<rawPath.length-1;i++){
    const a = rawPath[i], b = rawPath[i+1];
    const dist = calculateDistanceLatLng(a,b);
    const steps = Math.max(1, Math.ceil(dist / stepM));
    for(let s=0;s<steps;s++){
      const t = s / steps;
      out.push([ a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t ]);
    }
  }
  out.push(rawPath[rawPath.length-1]);
  return out;
}

/* Projektion på segment (returnerar posMeters) */
function projPointOnSeg(pt, seg){
  const ax = seg.coords[0][0], ay = seg.coords[0][1];
  const bx = seg.coords[1][0], by = seg.coords[1][1];
  const px = pt[0], py = pt[1];
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if(len2 === 0) {
    const dist = calculateDistanceLatLng([ax,ay],[px,py]);
    return {distMeters: dist, t:0, posMeters: 0};
  }
  const t = ((px-ax)*dx + (py-ay)*dy) / len2;
  const tc = Math.max(0, Math.min(1, t));
  const projLat = ax + tc*dx;
  const projLon = ay + tc*dy;
  const dist = calculateDistanceLatLng([px,py],[projLat,projLon]);
  const posMeters = tc * seg.lengthMeters;
  return {distMeters: dist, t: tc, posMeters: posMeters};
}

/* Markera träff (meters-baserat) */
function markSegmentVisited(seg, posMeters){
  seg.visitedMeters = seg.visitedMeters || [];
  seg.visitedMeters.push(posMeters);
}

/* Slå ihop meterintervall och beräkna coverage */
function finalizeSegmentCoverage(segments){
  segments.forEach(seg=>{
    if(!seg.visitedMeters || seg.visitedMeters.length === 0){
      seg.coveredMeters = 0; seg.coveredFraction = 0; seg._mergedIntervals = []; return;
    }
    seg.visitedMeters.sort((a,b)=>a-b);
    const delta = Math.max(0.5, SAMPLE_STEP_M * 0.6);
    const intervals = seg.visitedMeters.map(m => [ Math.max(0, m - delta), Math.min(seg.lengthMeters, m + delta) ]);
    const merged = [];
    let cur = intervals[0].slice();
    for(let i=1;i<intervals.length;i++){
      const iv = intervals[i];
      if(iv[0] <= cur[1] + MERGED_SLACK_M){
        cur[1] = Math.max(cur[1], iv[1]);
      } else {
        merged.push([Math.max(0,cur[0]), Math.min(seg.lengthMeters,cur[1])]);
        cur = iv.slice();
      }
    }
    merged.push([Math.max(0,cur[0]), Math.min(seg.lengthMeters,cur[1])]);
    let covered = 0;
    merged.forEach(iv=>{
      const a = Math.max(0, iv[0]);
      const b = Math.min(seg.lengthMeters, iv[1]);
      if(b > a) covered += (b - a);
    });
    seg.coveredMeters = Math.min(seg.lengthMeters, covered);
    seg.coveredFraction = seg.lengthMeters > 0 ? (seg.coveredMeters / seg.lengthMeters) : 0;
    seg._mergedIntervals = merged.map(iv => [ iv[0] / seg.lengthMeters, iv[1] / seg.lengthMeters ]);
  });
}

/* ---------- Visualisering ---------- */
function drawStreetBase(segments){
  streetBaseLayer.clearLayers();
  segments.forEach(seg=>{
    const latlngs = [ seg.coords[0], seg.coords[1] ];
    L.polyline(latlngs, {color:'#bdbfc1', weight:4, opacity:0.9}).addTo(streetBaseLayer);
  });
}
function drawCoverage(segments){
  coveredLayer.clearLayers();
  segments.forEach(seg=>{
    if(!seg._mergedIntervals || seg._mergedIntervals.length===0) return;
    seg._mergedIntervals.forEach(iv=>{
      const t0 = Math.max(0, Math.min(1, iv[0])), t1 = Math.max(0, Math.min(1, iv[1]));
      const a = seg.coords[0], b = seg.coords[1];
      const p0 = [ a[0] + (b[0]-a[0])*t0, a[1] + (b[1]-a[1])*t0 ];
      const p1 = [ a[0] + (b[0]-a[0])*t1, a[1] + (b[1]-a[1])*t1 ];
      L.polyline([p0,p1], {color:'#28a745', weight:6, opacity:0.95}).addTo(coveredLayer);
    });
  });
}

/* ---------- Aggregation per gatunamn ---------- */
function normalizeName(n){
  if(!n) return 'unnamed';
  return String(n).trim().replace(/\s+/g,' ').toLowerCase();
}
function aggregatePerStreetName(segments){
  const byName = new Map();
  segments.forEach(s=>{
    const nameKey = normalizeName(s.name);
    if(!byName.has(nameKey)) byName.set(nameKey, {
      name: s.name || 'unnamed',
      totalMeters: 0,
      coveredMeters: 0,
      wayIds: new Set()
    });
    const entry = byName.get(nameKey);
    entry.totalMeters += s.lengthMeters || 0;
    entry.coveredMeters += s.coveredMeters || 0;
    if(s.wayId) entry.wayIds.add(s.wayId);
  });
  const list = Array.from(byName.values()).map(e=>({
    name: e.name,
    totalMeters: e.totalMeters,
    coveredMeters: e.coveredMeters,
    coveredPct: e.totalMeters>0 ? (e.coveredMeters / e.totalMeters) : 0,
    wayCount: e.wayIds.size
  }));
  list.sort((a,b) => {
    if(b.coveredPct !== a.coveredPct) return b.coveredPct - a.coveredPct;
    return b.totalMeters - a.totalMeters;
  });
  return list;
}
function aggregateDistrict(items){
  const total = items.reduce((acc,w)=>acc + (w.totalMeters||0), 0);
  const covered = items.reduce((acc,w)=>acc + (w.coveredMeters||0), 0);
  return {total, covered, coveredPct: total>0 ? covered/total : 0};
}

/* ---------- Huvudanalys (använder alla sparade sträckor) ---------- */
function analyzeCoverage(){
  if(!recordedTracks || recordedTracks.length === 0){ alert('Inga sparade sträckor. Spela in en promenad först.'); return; }
  if(!streetSegments || streetSegments.length===0){ alert('Ladda gatnät först (Ladda gator för vy).'); return; }

  // reset segments
  streetSegments.forEach(s=>{ s.visitedMeters = []; s.coveredMeters = 0; s.coveredFraction = 0; s._mergedIntervals = []; });

  // samla samples från alla sparade spår
  const allSamples = [];
  recordedTracks.forEach(tr => {
    const samples = samplePath(tr.coords, SAMPLE_STEP_M);
    samples.forEach(s => allSamples.push(s));
  });

  const debug = document.getElementById('debugChk').checked;

  for(const pt of allSamples){
    const candIds = queryGrid(gridIndex, pt[0], pt[1], 2);
    for(const id of candIds){
      const seg = streetSegments[id];
      if(!seg) continue;
      const proj = projPointOnSeg(pt, seg);
      if(proj.distMeters <= PROXIMITY_M){
        markSegmentVisited(seg, proj.posMeters);
        if(debug) console.log('HIT seg', seg.id, seg.wayId, seg.name, 'posM=', proj.posMeters.toFixed(2), 'distM=', Math.round(proj.distMeters));
      }
    }
  }

  finalizeSegmentCoverage(streetSegments);
  drawCoverage(streetSegments);

  const streets = aggregatePerStreetName(streetSegments);
  const district = aggregateDistrict(streets);
  renderSummary(streets, district);

  if(debug) console.log('Segments with coverage:', streetSegments.filter(s=>s.coveredMeters>0).map(s=>[s.id,s.name,Math.round(s.lengthMeters),Math.round(s.coveredMeters)]));
}

/* ---------- UI render ---------- */
function renderSummary(streets, district){
  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML = `<strong>Stadsdelstäckning:</strong> ${(district.coveredPct*100).toFixed(2)}% av ${(district.total/1000).toFixed(2)} km` +
                        ` (täckt: ${(district.covered/1000).toFixed(2)} km).`;
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  const top = streets.slice(0,120);
  top.forEach(w=>{
    const li = document.createElement('li');
    const title = document.createElement('div');
    const wayInfo = w.wayCount ? ` <span class="small">(${w.wayCount} ways)</span>` : '';
    title.innerHTML = `<strong>${escapeHtml(String(w.name || 'unnamed'))}</strong>${wayInfo} <span class="small">(${(w.totalMeters).toFixed(0)} m / ${(w.coveredMeters).toFixed(0)} m)</span>`;
    const right = document.createElement('div');
    right.style.display='flex'; right.style.alignItems='center';
    const pctText = document.createElement('div');
    pctText.className='small'; pctText.textContent = `${(w.coveredPct*100).toFixed(1)}%`;
    const bar = document.createElement('div');
    bar.className='bar';
    const inner = document.createElement('i');
    inner.style.width = `${Math.round(w.coveredPct*100)}%`;
    bar.appendChild(inner);
    right.appendChild(pctText); right.appendChild(bar);
    li.appendChild(title); li.appendChild(right);
    listEl.appendChild(li);
  });
}

/* ---------- OSM / Overpass hentning ---------- */
async function loadStreetsForView(){
  const bounds = map.getBounds();
  const s = bounds.getSouth(), w = bounds.getWest(), n = bounds.getNorth(), e = bounds.getEast();
  const query = `
    [out:json][timeout:25];
    (
      way["highway"~"^(residential|unclassified|tertiary|secondary|primary|service|footway|living_street|pedestrian)$"](${s},${w},${n},${e});
    );
    out body;
    >;
    out skel qt;
  `;
  const url = 'https://overpass-api.de/api/interpreter';
  try {
    const resp = await fetch(url, { method:'POST', body: query });
    if(!resp.ok) throw new Error('Overpass error ' + resp.status);
    const data = await resp.json();
    const geo = overpassToGeoJSON(data);
    streetSegments = buildSegmentsFromWays(geo, DENSIFY_M);
    gridIndex = buildGridIndex(streetSegments);
    drawStreetBase(streetSegments);
    alert(`Hämtade ${geo.features.length} ways → ${streetSegments.length} segments.`);
  } catch(err){
    console.error(err);
    alert('Misslyckades att hämta gator: ' + (err.message || err));
  }
}

/* Enkel Overpass -> GeoJSON assembler */
function overpassToGeoJSON(osmJson){
  const nodes = new Map();
  (osmJson.elements || []).forEach(el => { if(el.type === 'node') nodes.set(el.id, el); });
  const features = [];
  (osmJson.elements || []).forEach(el => {
    if(el.type === 'way'){
      const coords = [];
      let ok = true;
      for(const nid of el.nodes){
        const n = nodes.get(nid);
        if(!n){ ok=false; break; }
        coords.push([n.lon, n.lat]);
      }
      if(!ok || coords.length < 2) return;
      const props = Object.assign({}, el.tags || {});
      props['@id'] = 'way/'+el.id;
      features.push({ type:'Feature', id: el.id, properties: props, geometry: { type:'LineString', coordinates: coords }});
    }
  });
  return { type:'FeatureCollection', features };
}

/* ---------- Inspelning: start/stop/spara ---------- */
function startRecording(){
  if(!navigator.geolocation){ alert('Geolocation stöds inte i din webbläsare.'); return; }
  if(watchId !== null){ alert('Inspelning redan igång.'); return; }
  currentTrack = { coords: [], startTs: Date.now(), endTs: null, id: 't' + Date.now() };
  // start watchPosition
  watchId = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    currentTrack.coords.push([lat, lon]);
    drawCurrentTrackPreview();
  }, err => {
    console.error('Geolocation error', err);
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  document.getElementById('startRecBtn').disabled = true;
  document.getElementById('stopRecBtn').disabled = false;
  document.getElementById('saveRecBtn').disabled = true;
}
function stopRecording(){
  if(watchId === null) return;
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
  currentTrack.endTs = Date.now();
  document.getElementById('startRecBtn').disabled = false;
  document.getElementById('stopRecBtn').disabled = true;
  document.getElementById('saveRecBtn').disabled = false;
  drawCurrentTrackPreview();
}
function saveCurrentTrack(){
  if(!currentTrack || !currentTrack.coords || currentTrack.coords.length < 2){ alert('Inga koordinater att spara.'); return; }
  // beräkna längd
  let len = 0;
  for(let i=0;i<currentTrack.coords.length-1;i++){
    len += calculateDistanceLatLng(currentTrack.coords[i], currentTrack.coords[i+1]);
  }
  const track = {
    id: currentTrack.id,
    name: 'Sträcka ' + (recordedTracks.length + 1),
    coords: currentTrack.coords.slice(),
    startTs: currentTrack.startTs,
    endTs: currentTrack.endTs || Date.now(),
    lengthMeters: len
  };
  recordedTracks.push(track);
  saveTracksToStorage();
  currentTrack = null;
  document.getElementById('saveRecBtn').disabled = true;
  renderTracksList();
  redrawAllTracks();
}
function discardCurrentTrack(){
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  currentTrack = null;
  document.getElementById('startRecBtn').disabled = false;
  document.getElementById('stopRecBtn').disabled = true;
  document.getElementById('saveRecBtn').disabled = true;
  drawCurrentTrackPreview();
}

/* ---------- Tracks UI och storage ---------- */
function saveTracksToStorage(){ try{ localStorage.setItem('walking_tracks_v1', JSON.stringify(recordedTracks)); }catch(e){console.warn('localStorage failed', e);} }
function loadTracksFromStorage(){ try{ const s = localStorage.getItem('walking_tracks_v1'); return s ? JSON.parse(s) : []; }catch(e){return []; } }

function renderTracksList(){
  const c = document.getElementById('tracksContainer');
  c.innerHTML = '';
  if(!recordedTracks || recordedTracks.length===0){ c.innerHTML = '<div class="small">Inga sparade sträckor.</div>'; return; }
  recordedTracks.forEach((t, idx) => {
    const div = document.createElement('div');
    div.className = 'track-item';
    const left = document.createElement('div');
    left.innerHTML = `<strong>${escapeHtml(t.name)}</strong> <span class="small">(${(t.lengthMeters/1000).toFixed(2)} km)</span>`;
    const right = document.createElement('div');
    right.className = 'track-actions';
    const btnCenter = document.createElement('button'); btnCenter.textContent = 'Centrera'; btnCenter.className='secondary';
    btnCenter.onclick = ()=>{ if(t.coords && t.coords.length) map.fitBounds(L.latLngBounds(t.coords).pad(0.12)); };
    const btnDelete = document.createElement('button'); btnDelete.textContent = 'Ta bort'; btnDelete.className='danger';
    btnDelete.onclick = ()=>{ if(confirm('Ta bort sträcka?')){ recordedTracks.splice(idx,1); saveTracksToStorage(); renderTracksList(); redrawAllTracks(); } };
    right.appendChild(btnCenter); right.appendChild(btnDelete);
    div.appendChild(left); div.appendChild(right);
    c.appendChild(div);
  });
}

/* Rita alla sparade tracks (röda) och aktuell preview (röd streckad) */
function redrawAllTracks(){
  trackLayerGroup.clearLayers();
  recordedTracks.forEach(t=>{
    if(t.coords && t.coords.length>1){
      L.polyline(t.coords, {color:'red', weight:4, opacity:0.9}).addTo(trackLayerGroup);
    }
  });
  drawCurrentTrackPreview();
}
function drawCurrentTrackPreview(){
  // ta bort tidigare preview
  // vi använder ett separat layer för preview
  if(window._currentPreviewLayer){ map.removeLayer(window._currentPreviewLayer); window._currentPreviewLayer = null; }
  if(currentTrack && currentTrack.coords && currentTrack.coords.length>0){
    window._currentPreviewLayer = L.polyline(currentTrack.coords, {color:'red', weight:4, dashArray:'6,8', opacity:0.9}).addTo(map);
  }
}

/* ---------- Buttons ---------- */
document.getElementById('loadStreetsBtn').addEventListener('click', loadStreetsForView);
document.getElementById('analyzeBtn').addEventListener('click', analyzeCoverage);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Rensa allt (inklusive sparade sträckor)?')) return;
  rawClearAll();
});
document.getElementById('centerBtn').addEventListener('click', ()=>{
  // centrera på alla sparade tracks eller på kartans vy
  if(recordedTracks && recordedTracks.length){
    const allCoords = recordedTracks.flatMap(t=>t.coords);
    if(allCoords.length) map.fitBounds(L.latLngBounds(allCoords).pad(0.12));
  } else {
    alert('Inga sparade sträckor att centrera på.');
  }
});
document.getElementById('startRecBtn').addEventListener('click', startRecording);
document.getElementById('stopRecBtn').addEventListener('click', stopRecording);
document.getElementById('saveRecBtn').addEventListener('click', saveCurrentTrack);

/* ---------- Rensa allt ---------- */
function rawClearAll(){
  recordedTracks = [];
  saveTracksToStorage();
  streetSegments = [];
  gridIndex = null;
  streetBaseLayer.clearLayers();
  coveredLayer.clearLayers();
  trackLayerGroup.clearLayers();
  document.getElementById('summary').textContent = 'Inget ännu. Ladda gator för området, spela in promenader och analysera.';
  document.getElementById('list').innerHTML = '';
  renderTracksList();
}

/* ---------- Kartklick (behåll för manuella tester) ---------- */
map.on('click', function(e){
  // om man vill lägga till manuellt punkt i currentTrack (valfritt)
  if(currentTrack){
    currentTrack.coords.push([e.latlng.lat, e.latlng.lng]);
    drawCurrentTrackPreview();
  }
});

/* ---------- Enkel hjälpfunktion för html-escaping ---------- */
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* ---------- Init: rendera sparade tracks om några ---------- */
renderTracksList();
redrawAllTracks();

/* ---------- Init done ---------- */
