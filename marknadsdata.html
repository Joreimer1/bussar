<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marknadsöversikt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #080b10;
    --bg-1: #0d1117;
    --bg-2: #131920;
    --bg-3: #1a2330;
    --border: #1e2d3d;
    --border-bright: #2a3f55;
    --text-primary: #e8edf3;
    --text-secondary: #7a9ab5;
    --text-dim: #3d5470;
    --accent-green: #00e5a0;
    --accent-red: #ff4d6d;
    --accent-gold: #f5c842;
    --accent-blue: #3d9eff;
    --accent-silver: #9ab8d0;
    --accent-oil: #ff8c42;
    --glow-green: rgba(0, 229, 160, 0.15);
    --glow-red: rgba(255, 77, 109, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-0);
    color: var(--text-primary);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30, 45, 61, 0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 45, 61, 0.3) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .logo-dot {
    width: 7px; height: 7px;
    background: var(--accent-green);
    border-radius: 50%;
    display: inline-block;
    margin-left: 2px;
    box-shadow: 0 0 10px var(--accent-green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-green); }
    50% { opacity: 0.5; box-shadow: 0 0 4px var(--accent-green); }
  }

  .header-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .header-time {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  .header-status {
    font-size: 11px;
    color: var(--text-dim);
  }

  #update-time {
    color: var(--accent-green);
  }

  /* Ticker strip */
  .ticker-wrap {
    overflow: hidden;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 0;
    margin-bottom: 32px;
    position: relative;
  }

  .ticker-track {
    display: flex;
    gap: 48px;
    animation: scroll-ticker 40s linear infinite;
    white-space: nowrap;
    width: max-content;
  }

  @keyframes scroll-ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .ticker-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }

  .ticker-label {
    color: var(--text-dim);
    letter-spacing: 0.08em;
    font-size: 10px;
  }

  .ticker-value {
    color: var(--text-primary);
    font-weight: 500;
  }

  .ticker-change.pos { color: var(--accent-green); }
  .ticker-change.neg { color: var(--accent-red); }

  /* Grid layout */
  .grid {
    display: grid;
    gap: 20px;
  }

  .grid-main {
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
  }

  .grid-fx {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    margin-top: 20px;
  }

  /* Cards */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .card:hover { border-color: var(--border-bright); }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent-blue));
    opacity: 0.7;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .card-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .price-main {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .price-change {
    font-size: 13px;
    font-weight: 500;
  }

  .price-change.pos { color: var(--accent-green); }
  .price-change.neg { color: var(--accent-red); }

  .price-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .chart-wrap {
    height: 160px;
    position: relative;
    width: 100%;
  }

  .chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* FX cards */
  .fx-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .fx-card:hover { border-color: var(--border-bright); }

  .fx-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent-blue));
    opacity: 0.7;
  }

  .fx-rate {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -1px;
    color: var(--text-primary);
    margin: 8px 0 4px;
  }

  .fx-label {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .fx-chart {
    height: 110px;
    margin-top: 14px;
    width: 100%;
  }

  .fx-chart canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* Section label */
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Loading state */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-3) 50%, var(--bg-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    height: 24px;
    width: 120px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Error badge */
  .error-badge {
    font-size: 11px;
    color: var(--accent-red);
    opacity: 0.7;
  }

  /* Dual currency display */
  .dual-price {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .dual-price-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .dual-price-currency {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .dual-price-value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--text-primary);
  }

  .dual-price-change {
    font-size: 11px;
    margin-top: 1px;
  }

  /* Loading bar */
  #loading-bar-wrap {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: 3px;
    background: var(--bg-2);
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
    transition: width 0.3s ease;
    box-shadow: 0 0 8px var(--accent-green);
  }
  #loading-status {
    position: fixed;
    top: 10px; right: 16px;
    font-size: 10px;
    color: var(--text-dim);
    z-index: 100;
    letter-spacing: 0.08em;
    transition: opacity 0.5s;
  }

  /* News grid */
  .grid-news {
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    margin-top: 0;
  }

  .news-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    min-height: 280px;
    display: flex;
    flex-direction: column;
  }

  .news-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-green);
    opacity: 0.5;
  }

  #news-geo::before { background: var(--accent-red); }

  .news-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .news-card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .news-icon {
    color: var(--accent-green);
    font-size: 14px;
  }

  .news-refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    line-height: 1;
  }

  .news-refresh-btn:hover {
    border-color: var(--border-bright);
    color: var(--text-secondary);
  }

  .news-refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .news-content {
    flex: 1;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-secondary);
  }

  .news-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 8px;
  }

  .news-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--accent-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  .news-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .news-item:last-child { border-bottom: none; }

  .news-item-headline {
    color: var(--text-primary);
    font-size: 12.5px;
    font-weight: 500;
    margin-bottom: 4px;
    line-height: 1.5;
    text-decoration: none;
    display: block;
    transition: color 0.2s;
  }

  .news-item-headline:hover { color: var(--accent-blue); }

  .news-item-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .news-item-summary {
    color: var(--text-secondary);
    font-size: 11.5px;
    line-height: 1.6;
  }

  .news-item-impact {
    display: inline-block;
    margin-top: 5px;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }

  .impact-high { background: rgba(255,77,109,0.12); color: var(--accent-red); border: 1px solid rgba(255,77,109,0.25); }
  .impact-med  { background: rgba(245,200,66,0.10); color: var(--accent-gold); border: 1px solid rgba(245,200,66,0.2); }
  .impact-low  { background: rgba(61,158,255,0.10); color: var(--accent-blue); border: 1px solid rgba(61,158,255,0.2); }

  .news-timestamp {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 12px;
    text-align: right;
  }

  .news-error {
    color: var(--accent-red);
    font-size: 12px;
    opacity: 0.7;
  }

  /* Footer */
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.8;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .grid-main { grid-template-columns: 1fr; }
    .grid-fx { grid-template-columns: 1fr; }
    .price-main { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="loading-bar-wrap"><div id="loading-bar"></div></div>
<div id="loading-status">Hämtar data…</div>
<div class="container">

  <header>
    <div class="logo">
      <span class="logo-title">MARKNAD</span>
      <span class="logo-dot"></span>
    </div>
    <div class="header-meta">
      <div class="header-time" id="clock">—</div>
      <div class="header-status">Uppdaterad <span id="update-time">—</span></div>
    </div>
  </header>

  <!-- Ticker -->
  <div class="ticker-wrap">
    <div class="ticker-track" id="ticker-track">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- Råvaror & Börser -->
  <div class="section-label">Råvaror</div>
  <div class="grid grid-main" id="commodity-grid">
    <!-- Cards injected -->
  </div>

  <div class="section-label" style="margin-top:28px;">Börsindex</div>
  <div class="grid grid-main" id="index-grid"></div>

  <div class="section-label" style="margin-top:28px;">Valutor</div>
  <div class="grid grid-fx" id="fx-grid"></div>

  <div class="section-label" style="margin-top:28px;">Nyhetsanalys · AI</div>
  <div class="grid grid-news" id="news-grid">
    <div class="news-card" id="news-finance">
      <div class="news-card-header">
        <div class="news-card-title">
          <span class="news-icon">◈</span> Finansiella marknader
        </div>
        <button class="news-refresh-btn" onclick="loadNews('finance')" title="Uppdatera">↻</button>
      </div>
      <div class="news-content" id="news-finance-content">
        <div class="news-loading">
          <div class="news-spinner"></div>
          <span>Hämtar finansnyheter…</span>
        </div>
      </div>
    </div>
    <div class="news-card" id="news-geo">
      <div class="news-card-header">
        <div class="news-card-title">
          <span class="news-icon" style="color:var(--accent-red)">◈</span> Geopolitiska risker
        </div>
        <button class="news-refresh-btn" onclick="loadNews('geo')" title="Uppdatera">↻</button>
      </div>
      <div class="news-content" id="news-geo-content">
        <div class="news-loading">
          <div class="news-spinner"></div>
          <span>Hämtar världsnyheter…</span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Datakälla: Yahoo Finance (via public API) &nbsp;·&nbsp; Kurser är fördröjda 15 min &nbsp;·&nbsp; Ej finansiell rådgivning
  </footer>
</div>

<script>
// ──────────────────────────────────────────────
// DATA FETCHING — Yahoo Finance query2 (no key needed)
// ──────────────────────────────────────────────

let usdSek = null;

const INSTRUMENTS = {
  commodities: [
    { symbol: 'CL=F',  label: 'Råolja (WTI)',  badge: 'USD/fat',  accent: '#ff8c42', dualSek: true },
    { symbol: 'GC=F',  label: 'Guld',           badge: 'USD/troy oz', accent: '#f5c842', dualSek: true },
    { symbol: 'SI=F',  label: 'Silver',          badge: 'USD/troy oz', accent: '#9ab8d0', dualSek: true },
  ],
  indices: [
    { symbol: '^OMX',    label: 'OMX Stockholm 30', badge: 'SEK',  accent: '#3d9eff', dualSek: false },
    { symbol: '^OMXSGI', label: 'OMX Stockholm GI', badge: 'SEK',  accent: '#00c8e0', dualSek: false },
    { symbol: '^DJI',    label: 'Dow Jones',         badge: 'USD',  accent: '#a78bfa', dualSek: false },
    { symbol: '^IXIC',   label: 'Nasdaq Composite',  badge: 'USD',  accent: '#00e5a0', dualSek: false },
  ],
  fx: [
    { symbol: 'SEK=X',  label: 'USD/SEK', accent: '#3d9eff' },
    { symbol: 'EURSEK=X', label: 'EUR/SEK', accent: '#f5c842' },
  ]
};

const chartInstances = {};

// Progress tracking
let progressDone = 0;
let progressTotal = 0;
function updateProgress(label) {
  progressDone++;
  const pct = Math.round((progressDone / progressTotal) * 100);
  document.getElementById('loading-bar').style.width = pct + '%';
  document.getElementById('loading-status').textContent = label;
  if (progressDone >= progressTotal) {
    setTimeout(() => {
      document.getElementById('loading-bar-wrap').style.opacity = '0';
      document.getElementById('loading-status').style.opacity = '0';
    }, 800);
  }
}

function yahooURL(symbol, range='5d', interval='1h') {
  const base = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}`;
  return `${base}?range=${range}&interval=${interval}&includePrePost=false`;
}

async function fetchYahoo(symbol, range='5d', interval='1h') {
  const url = yahooURL(symbol, range, interval);
  // Go straight to allorigins — avoids double-wait from failed direct attempt
  try {
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error('proxy fail');
    const d = await res.json();
    return parseYahoo(d);
  } catch {
    return null;
  }
}

function parseYahoo(data) {
  try {
    const result = data.chart.result[0];
    const meta = result.meta;
    const closes = result.indicators.quote[0].close;
    const timestamps = result.timestamp;
    // Filter nulls
    const points = timestamps.map((t, i) => ({ t, v: closes[i] })).filter(p => p.v != null);
    return {
      price: meta.regularMarketPrice,
      prevClose: meta.chartPreviousClose || meta.previousClose,
      currency: meta.currency,
      points
    };
  } catch { return null; }
}

function fmtNum(n, decimals=2) {
  if (n == null) return '—';
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function changeStr(price, prev) {
  if (!prev) return { str: '—', cls: '' };
  const diff = price - prev;
  const pct = (diff / prev) * 100;
  const cls = diff >= 0 ? 'pos' : 'neg';
  const sign = diff >= 0 ? '+' : '';
  return { str: `${sign}${fmtNum(pct, 2)}%`, cls };
}

// ──────────────────────────────────────────────
// CHART RENDERING
// ──────────────────────────────────────────────

function buildChart(canvasId, points, accentColor, mini=false) {
  if (chartInstances[canvasId]) {
    chartInstances[canvasId].destroy();
  }
  const canvas = document.getElementById(canvasId);
  if (!canvas || !points || points.length < 2) return;

  const labels = points.map(p => '');
  const values = points.map(p => p.v);
  const isUp = values[values.length - 1] >= values[0];

  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.offsetHeight || 130);
  grad.addColorStop(0, accentColor + '40');
  grad.addColorStop(1, accentColor + '00');

  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: accentColor,
        borderWidth: 1.5,
        backgroundColor: grad,
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600, easing: 'easeOutQuart' },
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#0d1117',
        borderColor: accentColor + '60',
        borderWidth: 1,
        titleColor: '#7a9ab5',
        bodyColor: '#e8edf3',
        callbacks: {
          label: ctx => ' ' + fmtNum(ctx.raw)
        }
      }},
      scales: {
        x: {
          display: true,
          ticks: {
            color: '#3d5470',
            font: { family: 'DM Mono', size: 9 },
            maxTicksLimit: 5,
            maxRotation: 0,
            callback: function(val, index) {
              const pt = points[index];
              if (!pt) return '';
              const d = new Date(pt.t * 1000);
              return d.toLocaleDateString('sv-SE', { month: 'numeric', day: 'numeric' })
                + ' ' + d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
            }
          },
          grid: { color: 'rgba(30,45,61,0.6)', drawBorder: false },
          border: { display: false }
        },
        y: {
          display: true,
          position: 'right',
          ticks: {
            color: '#3d5470',
            font: { family: 'DM Mono', size: 9 },
            maxTicksLimit: 4,
            callback: function(val) {
              if (val >= 10000) return (val/1000).toFixed(0) + 'k';
              if (val >= 1000) return val.toLocaleString('sv-SE', { maximumFractionDigits: 0 });
              if (val >= 10) return val.toFixed(1);
              return val.toFixed(3);
            }
          },
          grid: { color: 'rgba(30,45,61,0.6)', drawBorder: false },
          border: { display: false }
        }
      }
    }
  });
}

// ──────────────────────────────────────────────
// CARD BUILDERS
// ──────────────────────────────────────────────

function commodityCard(inst, data) {
  const { label, badge, accent, symbol, dualSek } = inst;
  const { price, prevClose, points } = data;
  const chg = changeStr(price, prevClose);
  const id = 'c_' + symbol.replace(/[^a-z0-9]/gi, '_');

  const sekPrice = (usdSek && dualSek) ? price * usdSek : null;
  const sekPrevClose = (usdSek && dualSek && prevClose) ? prevClose * usdSek : null;
  const sekChg = sekPrice ? changeStr(sekPrice, sekPrevClose) : null;

  return `
  <div class="card" style="--card-accent:${accent}">
    <div class="card-header">
      <div class="card-title">${label}</div>
      <div class="card-badge">${badge}</div>
    </div>
    <div class="dual-price">
      <div class="dual-price-item">
        <div class="dual-price-currency">USD</div>
        <div class="dual-price-value">${fmtNum(price)}</div>
        <div class="dual-price-change price-change ${chg.cls}">${chg.str}</div>
      </div>
      ${sekPrice ? `
      <div class="dual-price-item">
        <div class="dual-price-currency">SEK</div>
        <div class="dual-price-value">${fmtNum(sekPrice, 2)}</div>
        <div class="dual-price-change price-change ${sekChg.cls}">${sekChg.str}</div>
      </div>` : ''}
    </div>
    <div class="chart-wrap">
      <canvas id="${id}"></canvas>
    </div>
  </div>`;
}

function indexCard(inst, data) {
  const { label, badge, accent, symbol } = inst;
  const { price, prevClose, points } = data;
  const chg = changeStr(price, prevClose);
  const id = 'i_' + symbol.replace(/[^a-z0-9]/gi, '_');

  // for USD indices, show SEK equiv
  const isUSD = badge === 'USD';
  const sekEquiv = (isUSD && usdSek) ? price * usdSek : null;

  return `
  <div class="card" style="--card-accent:${accent}">
    <div class="card-header">
      <div class="card-title">${label}</div>
      <div class="card-badge">${badge}</div>
    </div>
    <div class="price-row">
      <div class="price-main">${fmtNum(price, price > 1000 ? 0 : 2)}</div>
      <div class="price-change ${chg.cls}">${chg.str}</div>
    </div>
    ${sekEquiv ? `<div class="price-sub">≈ ${fmtNum(sekEquiv, 0)} SEK</div>` : '<div class="price-sub">&nbsp;</div>'}
    <div class="chart-wrap">
      <canvas id="${id}"></canvas>
    </div>
  </div>`;
}

function fxCard(inst, data) {
  const { label, accent, symbol } = inst;
  const { price, prevClose, points } = data;
  const chg = changeStr(price, prevClose);
  const id = 'fx_' + symbol.replace(/[^a-z0-9]/gi, '_');

  return `
  <div class="fx-card" style="--card-accent:${accent}">
    <div class="fx-label">${label}</div>
    <div class="fx-rate">${fmtNum(price, 4)}</div>
    <div class="price-change ${chg.cls}" style="font-size:13px">${chg.str}</div>
    <div class="fx-chart">
      <canvas id="${id}"></canvas>
    </div>
  </div>`;
}

// ──────────────────────────────────────────────
// TICKER
// ──────────────────────────────────────────────

function buildTicker(allData) {
  const items = allData.map(({ inst, data }) => {
    const chg = changeStr(data.price, data.prevClose);
    return `<div class="ticker-item">
      <span class="ticker-label">${inst.label.toUpperCase()}</span>
      <span class="ticker-value">${fmtNum(data.price, data.price > 100 ? 2 : 4)}</span>
      <span class="ticker-change ${chg.cls}">${chg.str}</span>
    </div>`;
  }).join('');

  // Duplicate for seamless loop
  const track = document.getElementById('ticker-track');
  track.innerHTML = items + items;
}

// ──────────────────────────────────────────────
// CLAUDE NEWS ANALYSIS
// ──────────────────────────────────────────────

// ──────────────────────────────────────────────
// RSS NEWS
// ──────────────────────────────────────────────

const RSS_FEEDS = {
  finance: [
    'https://feeds.reuters.com/reuters/businessNews',
    'https://feeds.bbci.co.uk/news/business/rss.xml',
  ],
  geo: [
    'https://feeds.reuters.com/Reuters/worldNews',
    'https://feeds.bbci.co.uk/news/world/rss.xml',
  ]
};

async function fetchRSS(url) {
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error('rss fail');
  const text = await res.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/xml');
  return Array.from(doc.querySelectorAll('item')).slice(0, 8).map(item => ({
    title: item.querySelector('title')?.textContent?.trim() || '',
    desc:  item.querySelector('description')?.textContent?.replace(/<[^>]+>/g, '').trim() || '',
    link:  item.querySelector('link')?.textContent?.trim() || '#',
    date:  item.querySelector('pubDate')?.textContent?.trim() || '',
  }));
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
  if (diff < 1) return 'Just nu';
  if (diff < 60) return `${diff} min sedan`;
  const h = Math.floor(diff / 60);
  if (h < 24) return `${h} tim sedan`;
  return `${Math.floor(h/24)} dag sedan`;
}

async function loadNews(type) {
  const contentEl = document.getElementById(`news-${type}-content`);
  const btn = document.querySelector(`#news-${type} .news-refresh-btn`);

  contentEl.innerHTML = `<div class="news-loading"><div class="news-spinner"></div><span>Hämtar nyheter…</span></div>`;
  if (btn) btn.classList.add('spinning');

  try {
    // Fetch both feeds in parallel, merge and deduplicate
    const results = await Promise.allSettled(RSS_FEEDS[type].map(fetchRSS));
    const allItems = results
      .filter(r => r.status === 'fulfilled')
      .flatMap(r => r.value);

    // Deduplicate by title similarity, keep max 8
    const seen = new Set();
    const unique = allItems.filter(item => {
      const key = item.title.slice(0, 40).toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 8);

    if (unique.length === 0) throw new Error('Inga nyheter hittades');

    const items = unique.map(item => `
      <div class="news-item">
        <a class="news-item-headline" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
        ${item.desc ? `<div class="news-item-summary">${item.desc.slice(0, 160)}${item.desc.length > 160 ? '…' : ''}</div>` : ''}
        <div class="news-item-time">${timeAgo(item.date)}</div>
      </div>`).join('');

    const ts = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    contentEl.innerHTML = items + `<div class="news-timestamp">Reuters · BBC · ${ts}</div>`;

  } catch (err) {
    contentEl.innerHTML = `<div class="news-error">Kunde inte hämta nyheter: ${err.message}</div>`;
  } finally {
    if (btn) btn.classList.remove('spinning');
  }
}

// ──────────────────────────────────────────────
// CLOCK
// ──────────────────────────────────────────────

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
    ' — ' + now.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

// ──────────────────────────────────────────────
// MAIN
// ──────────────────────────────────────────────

async function loadAll() {
  const allInstruments = [
    ...INSTRUMENTS.commodities,
    ...INSTRUMENTS.indices,
    ...INSTRUMENTS.fx
  ];

  // Set total = all instruments (USD/SEK is already in fx list)
  progressDone = 0;
  progressTotal = allInstruments.length;
  document.getElementById('loading-bar').style.width = '0%';
  document.getElementById('loading-bar-wrap').style.opacity = '1';
  document.getElementById('loading-status').style.opacity = '1';

  // Fetch everything in parallel, update progress as each resolves
  const results = await Promise.all(
    allInstruments.map(inst =>
      fetchYahoo(inst.symbol, '5d', '1h').then(data => {
        updateProgress(inst.label);
        return { inst, data };
      })
    )
  );

  // Extract USD/SEK for conversion
  const sekResult = results.find(r => r.inst.symbol === 'SEK=X');
  if (sekResult?.data) usdSek = sekResult.data.price;

  const valid = results.filter(r => r.data);

  // Build ticker
  buildTicker(valid);

  // Inject cards
  const commGrid = document.getElementById('commodity-grid');
  const idxGrid = document.getElementById('index-grid');
  const fxGrid = document.getElementById('fx-grid');

  let commHtml = '', idxHtml = '', fxHtml = '';

  for (const { inst, data } of valid) {
    const isCommodity = INSTRUMENTS.commodities.some(c => c.symbol === inst.symbol);
    const isIndex = INSTRUMENTS.indices.some(c => c.symbol === inst.symbol);
    const isFX = INSTRUMENTS.fx.some(c => c.symbol === inst.symbol);

    if (isCommodity) commHtml += commodityCard(inst, data);
    else if (isIndex) idxHtml += indexCard(inst, data);
    else if (isFX) fxHtml += fxCard(inst, data);
  }

  commGrid.innerHTML = commHtml || '<div style="color:var(--text-dim);font-size:13px">Kunde ej hämta råvarudata.</div>';
  idxGrid.innerHTML = idxHtml || '<div style="color:var(--text-dim);font-size:13px">Kunde ej hämta indexdata.</div>';
  fxGrid.innerHTML = fxHtml || '<div style="color:var(--text-dim);font-size:13px">Kunde ej hämta valutadata.</div>';

  // Draw charts — setTimeout ensures layout is fully calculated (fixes file:// sizing)
  setTimeout(() => {
    for (const { inst, data } of valid) {
      const isCommodity = INSTRUMENTS.commodities.some(c => c.symbol === inst.symbol);
      const isIndex = INSTRUMENTS.indices.some(c => c.symbol === inst.symbol);
      const isFX = INSTRUMENTS.fx.some(c => c.symbol === inst.symbol);

      let prefix = isCommodity ? 'c_' : isIndex ? 'i_' : 'fx_';
      const id = prefix + inst.symbol.replace(/[^a-z0-9]/gi, '_');

      // Force canvas to inherit parent dimensions before Chart.js measures it
      const canvas = document.getElementById(id);
      if (canvas && canvas.parentElement) {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
      }

      buildChart(id, data.points, inst.accent || '#3d9eff');
    }
  }, 100);

  // Timestamp
  document.getElementById('update-time').textContent =
    new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
}

// Auto-refresh every 5 min
loadAll();
setInterval(loadAll, 5 * 60 * 1000);

// Load news on startup, refresh every 30 min
loadNews('finance');
loadNews('geo');
setInterval(() => loadNews('finance'), 30 * 60 * 1000);
setInterval(() => loadNews('geo'), 30 * 60 * 1000);
</script>
