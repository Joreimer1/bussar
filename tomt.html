<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pacman solskiva</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; }
    #topbar { padding:10px; background:#f7f7f7; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    #map { height: calc(100vh - 140px); }
    input[type="text"], input[type="date"] { padding:6px; width:260px; }
    button { padding:6px 10px; }
    #controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .info { font-size:13px; color:#333; }
    #meta { padding:8px; background:#fff; border-top:1px solid #ddd; }
    label { font-size:13px; }
  </style>
</head>
<body>

  <div id="topbar">
    <input id="address" type="text" placeholder="Skriv adress, t.ex. Storgatan 1, Stockholm" />
    <button id="searchBtn">Sök adress</button>

    <div id="controls">
      <button id="placePointBtn">Placera punkt</button>
      <label>Radie (m)</label>
      <input id="radius" type="number" value="50" style="width:80px" />
      <label>Fyllning</label>
      <input id="spread" type="number" value="180" style="width:80px" />
      <label>Datum</label>
      <input id="dateInput" type="date" />
      <input id="daySlider" type="range" min="1" max="366" value="1" style="width:220px" />
      <div id="dateLabel" class="info"></div>
    </div>
  </div>

  <div id="map"></div>
  <div id="meta"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

  <script>
    // Init map
    const map = L.map('map').setView([59.33, 18.07], 16);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    }).addTo(map);

    // State
    let pointMarker = null;
    let pacmanLayer = null;

    // UI
    const placePointBtn = document.getElementById('placePointBtn');
    const radiusInput = document.getElementById('radius');
    const spreadInput = document.getElementById('spread');
    const dateInput = document.getElementById('dateInput');
    const daySlider = document.getElementById('daySlider');
    const dateLabel = document.getElementById('dateLabel');
    const metaDiv = document.getElementById('meta');

    // Set initial date to today
    function setDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      dateInput.value = `${yyyy}-${mm}-${dd}`;
      const start = new Date(d.getFullYear(),0,1);
      const dayOfYear = Math.floor((d - start) / (24*60*60*1000)) + 1;
      daySlider.value = dayOfYear;
      dateLabel.textContent = d.toLocaleDateString();
    }
    setDate(new Date());

    // Slider -> date
    daySlider.addEventListener('input', () => {
      const year = (new Date()).getFullYear();
      const day = Number(daySlider.value);
      const newDate = new Date(year,0,1 + day - 1);
      setDate(newDate);
      drawPacman();
    });

    // Date input -> slider
    dateInput.addEventListener('change', () => {
      const d = new Date(dateInput.value);
      if (isNaN(d)) return;
      setDate(d);
      drawPacman();
    });

    // Place point mode
    let placing = false;
    placePointBtn.addEventListener('click', () => {
      placing = true;
      placePointBtn.textContent = 'Klicka på kartan';
      map.getContainer().style.cursor = 'crosshair';
    });

    map.on('click', (e) => {
      if (placing) {
        placing = false;
        placePointBtn.textContent = 'Placera punkt';
        map.getContainer().style.cursor = '';
        setPoint(e.latlng);
      }
    });

    function setPoint(latlng) {
      if (pointMarker) map.removeLayer(pointMarker);
      pointMarker = L.marker(latlng, { draggable: true }).addTo(map);
      pointMarker.on('dragend', drawPacman);
      drawPacman();
    }

    // Build Pacman sector for whole day when sun is above horizon
    function drawPacman() {
      if (!pointMarker) return;
      if (pacmanLayer) map.removeLayer(pacmanLayer);

      const latlng = pointMarker.getLatLng();
      const radius = Number(radiusInput.value) || 50;
      const spreadOverride = Number(spreadInput.value) || 180;

      // parse date from input, use local midnight as base
      const dateStr = dateInput.value;
      if (!dateStr) return;
      const baseDate = new Date(dateStr + 'T12:00:00'); // midday to avoid timezone issues

      // compute sunrise and sunset times using SunCalc
      const times = SunCalc.getTimes(baseDate, latlng.lat, latlng.lng);
      const sunrise = times.sunrise;
      const sunset = times.sunset;

      // handle polar cases
      let infoHtml = '';
      if (!sunrise || !sunset || isNaN(sunrise) || isNaN(sunset)) {
        // sun does not rise or does not set
        // determine if sun is always above or always below horizon
        const noonPos = SunCalc.getPosition(new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), 12), latlng.lat, latlng.lng);
        if (noonPos.altitude > 0) {
          infoHtml += '<strong>Sol alltid över horisonten denna dag</strong><br>';
          // full circle
          const circle = turf.circle([latlng.lng, latlng.lat], radius/1000, {steps:64, units:'kilometers'});
          pacmanLayer = L.geoJSON(circle, {
            style: { color:'rgba(255,180,40,0.9)', weight:1, fillColor:'rgba(255,200,50,0.45)', fillOpacity:1, interactive:false }
          }).addTo(map);
          metaDiv.innerHTML = infoHtml;
          return;
        } else {
          infoHtml += '<strong>Sol under horisonten hela dagen</strong><br>';
          metaDiv.innerHTML = infoHtml;
          return;
        }
      }

      // get azimuths at sunrise and sunset
      const sunRisePos = SunCalc.getPosition(sunrise, latlng.lat, latlng.lng);
      const sunSetPos = SunCalc.getPosition(sunset, latlng.lat, latlng.lng);

      // convert SunCalc azimuth to compass bearing 0=north clockwise
      function azimuthDegFromSunCalc(azRad) {
        let deg = (180 + azRad * 180 / Math.PI) % 360;
        if (deg < 0) deg += 360;
        return deg;
      }
      const azRise = azimuthDegFromSunCalc(sunRisePos.azimuth);
      const azSet = azimuthDegFromSunCalc(sunSetPos.azimuth);

      // Determine sector start and end angles going the short way across horizon where sun is above
      // We want the sector that spans from azRise to azSet following the sun's path above horizon
      // Determine direction: compute difference going clockwise
      function angleDiffCW(a, b) {
        return ( (b - a + 360) % 360 );
      }
      const cwDiff = angleDiffCW(azRise, azSet);
      const ccwDiff = 360 - cwDiff;
      let startAngle, endAngle;
      if (cwDiff <= ccwDiff) {
        startAngle = azRise;
        endAngle = azSet;
      } else {
        startAngle = azSet;
        endAngle = azRise;
      }

      // Optionally limit spread by user override: if user sets spread < computed span, center it on midday azimuth
      const computedSpan = angleDiffCW(startAngle, endAngle);
      let finalStart = startAngle;
      let finalEnd = endAngle;
      if (spreadOverride > 0 && spreadOverride < computedSpan) {
        // center on sun azimuth at local solar noon
        const noon = SunCalc.getTimes(baseDate, latlng.lat, latlng.lng).solarNoon || new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), 12);
        const noonPos = SunCalc.getPosition(noon, latlng.lat, latlng.lng);
        const noonAz = azimuthDegFromSunCalc(noonPos.azimuth);
        const half = spreadOverride / 2;
        finalStart = (noonAz - half + 360) % 360;
        finalEnd = (noonAz + half) % 360;
      }

      // Build arc coordinates from finalStart to finalEnd following the shorter arc that represents sun above horizon
      // Determine step count
      let span = angleDiffCW(finalStart, finalEnd);
      if (span === 0) span = 360;
      const steps = Math.max(12, Math.round(span / 2));
      const center = turf.point([latlng.lng, latlng.lat]);
      const arcCoords = [];
      arcCoords.push([latlng.lng, latlng.lat]);

      // iterate clockwise from finalStart to finalEnd
      for (let i = 0; i <= steps; i++) {
        const frac = i / steps;
        const angle = (finalStart + frac * span) % 360;
        const dest = turf.destination(center, radius / 1000, angle, { units: 'kilometers' });
        arcCoords.push(dest.geometry.coordinates);
      }
      arcCoords.push([latlng.lng, latlng.lat]);

      const fanGeoJson = { type:'Feature', geometry:{ type:'Polygon', coordinates:[arcCoords] } };

      pacmanLayer = L.geoJSON(fanGeoJson, {
        style: {
          color: 'rgba(255,160,30,0.9)',
          weight: 1,
          fillColor: 'rgba(255,200,50,0.45)',
          fillOpacity: 1,
          interactive: false
        }
      }).addTo(map);

      // Meta info
      const fmt = (d) => new Date(d).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      infoHtml += `<strong>Datum</strong>: ${new Date(dateInput.value).toLocaleDateString()} &nbsp; <strong>Radie</strong>: ${radius} m<br>`;
      infoHtml += `<strong>Soluppgång</strong>: ${fmt(sunrise)} &nbsp; Azimut ${azRise.toFixed(1)}°<br>`;
      infoHtml += `<strong>Solnedgång</strong>: ${fmt(sunset)} &nbsp; Azimut ${azSet.toFixed(1)}°<br>`;
      infoHtml += `<strong>Pacman span</strong>: ${span.toFixed(1)}° (beräknad)`;
      metaDiv.innerHTML = infoHtml;
    }

    // Update when inputs change
    radiusInput.addEventListener('change', drawPacman);
    spreadInput.addEventListener('change', drawPacman);

    // Geocoding (Nominatim)
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const q = document.getElementById('address').value.trim();
      if (!q) return;
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
        const res = await fetch(url, { headers: { 'Accept-Language': 'sv' }});
        const data = await res.json();
        if (data && data.length) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 19);
        } else {
          alert('Adress hittades inte. Försök med mer detaljer.');
        }
      } catch (err) {
        console.error(err);
        alert('Fel vid sökning.');
      }
    });

    // Keep pacman updated on map move and when marker dragged
    map.on('moveend', drawPacman);

    // initial hint
    map.whenReady(() => {
      L.control.scale().addTo(map);
      const hint = L.control({position:'bottomleft'});
      hint.onAdd = function() {
        const div = L.DomUtil.create('div','info');
        div.style.padding = '6px';
        div.style.background = 'rgba(255,255,255,0.9)';
        div.innerHTML = '<strong>Instruktion</strong>: Klicka "Placera punkt" och klicka på kartan. Använd datum‑slider för att se hur Pacman ändras över året.';
        return div;
      };
      hint.addTo(map);
    });

    // Expose drawPacman for debugging
    window.drawPacman = drawPacman;
  </script>
</body>
</html>
