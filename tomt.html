<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Placera hus på flygfoto</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; }
    #topbar { padding:10px; background:#f7f7f7; display:flex; gap:8px; align-items:center; }
    #map { height: calc(100vh - 64px); }
    input[type="text"] { padding:6px; width:320px; }
    button { padding:6px 10px; }
    #info { padding:8px; font-size:14px; }
    .ok { color: green; font-weight:700; }
    .nok { color: red; font-weight:700; }
  </style>
</head>
<body>

  <div id="topbar">
    <input id="address" type="text" placeholder="Skriv adress, t.ex. Storgatan 1, Stockholm" />
    <button id="searchBtn">Hämta flygfoto</button>
    <button id="drawLotBtn">Rita tomt</button>
    <button id="drawHouseBtn">Rita hus</button>
    <button id="clearBtn">Rensa</button>
    <div id="info"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Draw -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <!-- Turf for spatial ops -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    // Init map
    const map = L.map('map').setView([59.33, 18.07], 16);

    // Esri World Imagery (flygfoto) - ingen API-nyckel krävs för grundläggande användning
    const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
    }).addTo(map);

    // Feature group for drawn items
    const drawnItems = new L.FeatureGroup().addTo(map);

    // Draw control (we will programmatically enable modes)
    const drawControl = new L.Control.Draw({
      draw: {
        polygon: true,
        rectangle: true,
        polyline: false,
        circle: false,
        marker: false,
        circlemarker: false
      },
      edit: {
        featureGroup: drawnItems,
        remove: true
      }
    });
    map.addControl(drawControl);

    // State
    let lotLayer = null;
    let houseLayer = null;
    const infoDiv = document.getElementById('info');

    // Helpers
    function showInfo(html) { infoDiv.innerHTML = html; }

    function geojsonFromLayer(layer) {
      return layer.toGeoJSON();
    }

    function areaSqM(geojson) {
      return turf.area(geojson); // returns square meters
    }

    function checkHouseWithinLot() {
      if (!lotLayer || !houseLayer) {
        showInfo('Rita först en tomt och ett hus för att kontrollera passform.');
        return;
      }
      const lot = geojsonFromLayer(lotLayer);
      const house = geojsonFromLayer(houseLayer);

      const houseArea = areaSqM(house);
      const lotArea = areaSqM(lot);

      const within = turf.booleanWithin(house, lot);
      const intersects = turf.booleanOverlap ? turf.booleanOverlap(house, lot) : false;

      let status = within ? '<span class="ok">Huset ligger helt inom tomten</span>' : '<span class="nok">Huset ligger inte helt inom tomten</span>';
      // area formatting
      const ha = (lotArea/10000).toFixed(3);
      showInfo(`${status} &nbsp; Tomtarea: <strong>${lotArea.toFixed(0)} m²</strong> (${ha} ha) &nbsp; Husarea: <strong>${houseArea.toFixed(0)} m²</strong>`);
    }

    // Draw created
    map.on(L.Draw.Event.CREATED, function (e) {
      const layer = e.layer;
      drawnItems.addLayer(layer);

      if (e.layerType === 'polygon') {
        // If no lot yet, treat first polygon as lot; otherwise treat as house polygon
        if (!lotLayer) {
          lotLayer = layer;
          layer.bindPopup('Tomt (redigera med verktyget)').openPopup();
        } else if (!houseLayer) {
          houseLayer = layer;
          layer.bindPopup('Hus (redigera med verktyget)').openPopup();
        } else {
          // extra polygon: just keep it
        }
      } else if (e.layerType === 'rectangle') {
        // rectangles can be house if house not set
        if (!houseLayer) {
          houseLayer = layer;
          layer.bindPopup('Hus (rektangel)').openPopup();
        } else if (!lotLayer) {
          lotLayer = layer;
          layer.bindPopup('Tomt (rektangel)').openPopup();
        } else {
          // extra
        }
      }
      checkHouseWithinLot();
    });

    // When edited or deleted, update references and re-check
    map.on('draw:edited', function (e) {
      e.layers.eachLayer(function(layer) {
        // nothing special: keep references if same object
      });
      checkHouseWithinLot();
    });

    map.on('draw:deleted', function (e) {
      e.layers.eachLayer(function(layer) {
        if (lotLayer && layer === lotLayer) lotLayer = null;
        if (houseLayer && layer === houseLayer) houseLayer = null;
      });
      checkHouseWithinLot();
    });

    // Buttons
    document.getElementById('drawLotBtn').addEventListener('click', () => {
      // programmatically start polygon draw
      new L.Draw.Polygon(map, drawControl.options.draw.polygon).enable();
    });

    document.getElementById('drawHouseBtn').addEventListener('click', () => {
      // start rectangle draw for house
      new L.Draw.Rectangle(map, drawControl.options.draw.rectangle).enable();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      drawnItems.clearLayers();
      lotLayer = null;
      houseLayer = null;
      showInfo('');
    });

    // Geocoding (Nominatim)
    async function geocodeAndCenter(q) {
      if (!q) return;
      showInfo('Söker adress...');
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
        const res = await fetch(url, { headers: { 'Accept-Language': 'sv' }});
        const data = await res.json();
        if (data && data.length) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 19);
          showInfo('Adress hittad och kartan centrerad.');
        } else {
          showInfo('<span class="nok">Adress hittades inte. Försök med mer detaljer.</span>');
        }
      } catch (err) {
        console.error(err);
        showInfo('<span class="nok">Fel vid sökning.</span>');
      }
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      const q = document.getElementById('address').value.trim();
      geocodeAndCenter(q);
    });

    // Re-check when layers are moved (Leaflet Draw edit handles)
    drawnItems.on('layeradd', () => {});
    // Also re-check on map click (safety)
    map.on('click', () => { checkHouseWithinLot(); });

    // Initial hint
    showInfo('Skriv en adress och klicka "Hämta flygfoto". Rita tomt och hus med knapparna ovan.');
  </script>
</body>
</html>
