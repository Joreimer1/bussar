<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fartygsradar – Hormuzsundet 0.9</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
  :root {
    --bg:#050d14; --surface:#0a1a26; --panel:#0d2035;
    --accent:#00e5ff; --accent2:#00ff9d; --warn:#ff6b35;
    --text:#c8dde8; --dim:#4a6a7a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid rgba(0,229,255,.15);flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{width:28px;height:28px}
  h1{font-size:1.2rem;font-weight:700;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
  .status-bar{display:flex;align-items:center;gap:10px;font-family:'Share Tech Mono',monospace;font-size:.7rem}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s}
  .dot.live{background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:pulse 2s infinite}
  .dot.error{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  #status-text{color:var(--dim)}
  #vessel-count{color:var(--accent2);font-weight:bold}
  #map{flex:1;position:relative}
  .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.8)}
  .leaflet-container{background:var(--bg)}
  #info-panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:900;background:var(--panel);border:1px solid rgba(0,229,255,.25);border-radius:4px;padding:12px 16px;min-width:280px;max-width:90vw;display:none;font-family:'Share Tech Mono',monospace;font-size:.72rem;box-shadow:0 0 30px rgba(0,0,0,.6)}
  #info-panel.visible{display:block}
  #info-title{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  .info-label{color:var(--dim)}
  .info-val{color:var(--text)}
  .close-btn{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem}
  .close-btn:hover{color:var(--warn)}
  #legend{position:absolute;top:12px;right:12px;z-index:900;background:var(--panel);border:1px solid rgba(0,229,255,.15);border-radius:4px;padding:10px 12px;font-family:'Share Tech Mono',monospace;font-size:.65rem}
  .legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .legend-item:last-child{margin-bottom:0}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  #controls{position:absolute;top:12px;left:12px;z-index:900;display:flex;flex-direction:column;gap:6px}
  .ctrl-btn{background:var(--panel);border:1px solid rgba(0,229,255,.2);color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:.65rem;padding:6px 10px;border-radius:3px;cursor:pointer;letter-spacing:1px}
  .ctrl-btn:hover{background:var(--surface);border-color:var(--accent)}
  #worker-modal{position:fixed;inset:0;background:rgba(5,13,20,.97);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal-box{background:var(--panel);border:1px solid rgba(0,229,255,.3);border-radius:6px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 0 60px rgba(0,229,255,.08)}
  .modal-box h2{font-size:1.1rem;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
  .modal-box p{color:var(--dim);font-size:.85rem;line-height:1.6;margin-bottom:12px}
  .modal-box code{font-family:'Share Tech Mono',monospace;color:var(--accent2);background:rgba(0,255,157,.07);padding:2px 5px;border-radius:2px;font-size:.8rem}
  #worker-url-input{width:100%;background:var(--bg);border:1px solid rgba(0,229,255,.2);border-radius:3px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:.8rem;padding:10px 12px;outline:none;margin-bottom:12px;letter-spacing:1px}
  #worker-url-input:focus{border-color:var(--accent)}
  #worker-url-input::placeholder{color:var(--dim)}
  .btn{flex:1;padding:10px;border:none;border-radius:3px;font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-primary{background:var(--accent);color:var(--bg)}
  .btn-secondary{background:var(--surface);color:var(--dim);border:1px solid var(--dim)}
  .modal-actions{display:flex;gap:10px}
  .leaflet-popup-content-wrapper{background:var(--panel)!important;color:var(--text)!important;border:1px solid rgba(0,229,255,.25)!important;border-radius:4px!important}
  .leaflet-popup-tip{background:var(--panel)!important}
</style>
</head>
<body>

<!-- WORKER URL MODAL -->
<div id="worker-modal">
  <div class="modal-box">
    <h2>🛳 Fartygsradar</h2>
    <p>
      Ange URL:en till din Cloudflare Worker.<br><br>
      Formatet är:<br>
      <code>https://fartygsradar.DITT-NAMN.workers.dev</code><br><br>
      Workern ansluter till aisstream.io på serversidan och skickar positionerna hit var 5:e sekund.
    </p>
    <input id="worker-url-input" type="url"
      placeholder="https://fartygsradar.xxx.workers.dev"
      autocomplete="off" spellcheck="false"/>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="useDemo()">Demo-läge</button>
      <button class="btn btn-primary" onclick="startWorker()">Anslut</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 22 L16 8 L28 22 L4 22Z" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M4 22 Q16 28 28 22" stroke="#00e5ff" stroke-width="1.5" fill="none"/>
      <line x1="16" y1="8" x2="16" y2="4" stroke="#00e5ff" stroke-width="1.5"/>
      <line x1="16" y1="4" x2="22" y2="6" stroke="#00e5ff" stroke-width="1"/>
    </svg>
    <h1>Fartygsradar</h1>
  </div>
  <div class="status-bar">
    <div class="dot" id="conn-dot"></div>
    <span id="status-text">Väntar…</span>
    <span>|</span>
    <span id="vessel-count">0</span>&nbsp;fartyg
  </div>
</header>

<div id="map">
  <div id="controls">
    <button class="ctrl-btn" onclick="map.setView([26.5,56.5],9)">📍 Hormuz</button>
    <button class="ctrl-btn" onclick="clearAll()">🗑 Rensa</button>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#00e5ff"></div>Cargo</div>
    <div class="legend-item"><div class="legend-dot" style="background:#00ff9d"></div>Tanker</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffdd00"></div>Passagerar</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff6b35"></div>Fiskebåt</div>
    <div class="legend-item"><div class="legend-dot" style="background:#cc88ff"></div>Övrigt</div>
  </div>
  <div id="info-panel">
    <button class="close-btn" onclick="closePanel()">✕</button>
    <div id="info-title">–</div>
    <div class="info-grid" id="info-grid"></div>
  </div>
</div>

<script>
// ── MAP ──
const map = L.map('map', {zoomControl:false}).setView([26.5, 56.5], 9);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap', maxZoom:19
}).addTo(map);

// ── STATE ──
let markers = {};   // mmsi → L.marker
let vesselData = {}; // mmsi → data
let pollInterval = null;
let workerUrl = '';

// ── COLORS ──
function color(t) {
  if (!t) return '#cc88ff';
  if (t>=70&&t<=79) return '#00e5ff';
  if (t>=80&&t<=89) return '#00ff9d';
  if (t>=60&&t<=69) return '#ffdd00';
  if (t>=30&&t<=39) return '#ff6b35';
  return '#cc88ff';
}
function typeName(t) {
  if (!t) return 'Okänd';
  if (t>=70&&t<=79) return 'Cargo';
  if (t>=80&&t<=89) return 'Tanker';
  if (t>=60&&t<=69) return 'Passagerar';
  if (t>=30&&t<=39) return 'Fiskebåt';
  if (t>=50&&t<=59) return 'Servicefartyg';
  return 'Övrigt';
}

function arrowIcon(c, heading) {
  const h = (heading && heading !== 511) ? heading : 0;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
    <g transform="rotate(${h},10,10)">
      <polygon points="10,2 14,16 10,13 6,16" fill="${c}" opacity=".9" stroke="#000" stroke-width=".5"/>
    </g></svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[20,20], iconAnchor:[10,10]});
}

// ── UPSERT VESSEL ──
function upsert(v) {
  const c = color(v.shipType);
  const h = v.heading ?? v.cog ?? null;
  if (markers[v.mmsi]) {
    markers[v.mmsi].setLatLng([v.lat, v.lon]);
    markers[v.mmsi].setIcon(arrowIcon(c, h));
  } else {
    markers[v.mmsi] = L.marker([v.lat, v.lon], {icon: arrowIcon(c, h)})
      .addTo(map)
      .on('click', () => showPanel(v.mmsi));
  }
  vesselData[v.mmsi] = v;
  document.getElementById('vessel-count').textContent = Object.keys(markers).length;
}

// ── POLL WORKER ──
async function poll() {
  try {
    const r = await fetch(workerUrl + '/vessels');
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();

    setStatus(json.connected ? 'live' : 'error',
      json.connected ? 'Live via Worker' : 'Worker ej ansluten till AIS');

    (json.vessels || []).forEach(upsert);
  } catch(e) {
    setStatus('error', 'Kan inte nå Workern');
  }
}

// ── INFO PANEL ──
function showPanel(mmsi) {
  const v = vesselData[mmsi];
  if (!v) return;
  document.getElementById('info-title').textContent = v.name || v.callsign || `MMSI ${mmsi}`;
  const rows = [
    ['MMSI', mmsi],
    ['Typ', typeName(v.shipType)],
    ['Kurs', v.cog != null ? `${Math.round(v.cog)}°` : '–'],
    ['Fart', v.sog != null ? `${Number(v.sog).toFixed(1)} kn` : '–'],
    ['Destination', v.destination || '–'],
    ['IMO', v.imo || '–'],
    ['Position', `${Number(v.lat).toFixed(4)}, ${Number(v.lon).toFixed(4)}`],
  ];
  document.getElementById('info-grid').innerHTML = rows
    .map(([l,val]) => `<span class="info-label">${l}</span><span class="info-val">${val}</span>`)
    .join('');
  document.getElementById('info-panel').classList.add('visible');
}
function closePanel() { document.getElementById('info-panel').classList.remove('visible'); }
function clearAll() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {}; vesselData = {};
  document.getElementById('vessel-count').textContent = '0';
}

// ── STATUS ──
function setStatus(state, text) {
  document.getElementById('conn-dot').className = 'dot' + (state ? ' '+state : '');
  document.getElementById('status-text').textContent = text;
}

// ── START ──
function startWorker() {
  let url = document.getElementById('worker-url-input').value.trim().replace(/\/$/, '');
  if (!url) return;
  workerUrl = url;
  document.getElementById('worker-modal').style.display = 'none';
  setStatus('', 'Ansluter…');
  poll();
  pollInterval = setInterval(poll, 5000);
}

// ── DEMO ──
const DEMO = [
  {mmsi:'3661',name:'GULF PIONEER',lat:26.55,lon:56.25,shipType:80,cog:280,sog:12.4},
  {mmsi:'3662',name:'HORMUZ STAR',lat:26.38,lon:56.60,shipType:80,cog:100,sog:11.8},
  {mmsi:'3663',name:'AL SALAM',lat:26.80,lon:55.90,shipType:70,cog:230,sog:9.5},
  {mmsi:'3664',name:'IRAN MEHR',lat:27.10,lon:56.95,shipType:70,cog:185,sog:10.2},
  {mmsi:'3665',name:'MUSCAT EXPRESS',lat:25.95,lon:57.20,shipType:60,cog:320,sog:15.1},
  {mmsi:'3666',name:'BAHRAIN GLORY',lat:26.60,lon:55.60,shipType:80,cog:90,sog:13.7},
  {mmsi:'3667',name:'DUBAI TRADER',lat:25.70,lon:56.80,shipType:70,cog:45,sog:8.9},
  {mmsi:'3668',name:'ZAGROS CARRIER',lat:27.05,lon:55.20,shipType:80,cog:135,sog:14.3},
  {mmsi:'3669',name:'QESHM NAVIGATOR',lat:26.95,lon:56.10,shipType:30,cog:70,sog:5.5},
  {mmsi:'3670',name:'STRAIT RUNNER',lat:26.30,lon:57.00,shipType:80,cog:265,sog:16.0},
];
function useDemo() {
  document.getElementById('worker-modal').style.display = 'none';
  setStatus('live', 'Demo-läge');
  DEMO.forEach(v => upsert(v));
  setInterval(() => {
    DEMO.forEach(v => {
      const r = v.cog * Math.PI / 180;
      v.lat += Math.cos(r) * 0.008;
      v.lon += Math.sin(r) * 0.012;
      upsert(v);
    });
  }, 1500);
}
</script>
</body>
</html>
