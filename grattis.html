<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Grattis älskling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      color: #fdf5f5;
      background-color: #120b0d;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        linear-gradient(to bottom right, rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
        url("restaurant.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .card {
      max-width: 640px;
      background: rgba(20, 10, 14, 0.9);
      border-radius: 18px;
      padding: 2.5rem 3rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 192, 203, 0.25);
      backdrop-filter: blur(6px);
    }

    .card h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffd6e0;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(to right, #ff9fb8, #ffd6e0);
      margin: 0.5rem 0 1.5rem;
    }

    .card p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #ffeef3;
      margin-bottom: 1.2rem;
    }

    .highlight {
      font-size: 1.25rem;
      color: #ffb6c8;
      font-weight: 600;
    }

    .time-place {
      margin-top: 1.5rem;
      padding: 1.2rem 1.4rem;
      border-radius: 14px;
      background: rgba(255, 192, 203, 0.08);
      border: 1px solid rgba(255, 192, 203, 0.35);
    }

    .time-place strong {
      color: #ffd6e0;
    }

    .names {
      margin-top: 1.4rem;
      font-style: italic;
      color: #ffccd8;
    }

    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.6rem;
      }

      .card h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <h1>Grattis älskling på födelsedagen!</h1>
      <div class="divider"></div>

      <p class="highlight">
        Jag vill fira dig på ett sätt som bara är vårt.
      </p>

      <p>
        På fredag <strong>17:30</strong> går
        <strong>du och jag och Bella</strong>
        på Rosettas i Hornstull.
      </p>

      <div class="time-place">
        <p><strong>När:</strong> Fredag kl. 17:30</p>
        <p><strong>Var:</strong> Rosettas, Hornstull</p>
      </div>

      <p class="names">
        Bara vi, god mat, och en kväll som är helt din.
      </p>
    </div>
  </section>
</body>
</html>
