<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Grattis älskling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: "Georgia", serif;
      background-color: #120b0d;
      color: #ffeef3;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        linear-gradient(to bottom right, rgba(0,0,0,0.25), rgba(0,0,0,0.45)),
        url("restaurang.jpg");
      background-size: cover;
      background-position: center;
    }

    .card {
      max-width: 650px;
      padding: 2.5rem 3rem;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 192, 203, 0.35);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* Blom-ikoner i hörnen */
    .card::before,
    .card::after {
      content: "🌸";
      position: absolute;
      font-size: 2.2rem;
      opacity: 0.35;
    }

    .card::before {
      top: 12px;
      left: 18px;
    }

    .card::after {
      bottom: 12px;
      right: 18px;
    }

    h1 {
      font-size: 2.4rem;
      color: #ffd6e0;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(to right, #ff9fb8, #ffd6e0);
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .highlight {
      color: #ffb6c8;
      font-weight: 600;
    }

    .time-place {
      margin-top: 1.5rem;
      padding: 1.2rem 1.4rem;
      border-radius: 14px;
      background: rgba(255, 192, 203, 0.08);
      border: 1px solid rgba(255, 192, 203, 0.35);
    }

    .names {
      margin-top: 1.4rem;
      font-style: italic;
      color: #ffccd8;
    }

    @media (max-width: 600px) {
      .card {
        padding: 2rem 1.6rem;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <h1>Grattis älskling på födelsedagen!</h1>
      <div class="divider"></div>

      <p class="highlight">Jag vill fira dig på ett sätt som bara är vårt.</p>

      <p>
        På fredag <strong>17:30</strong> går
        <strong>du och jag och Bella</strong>
        på Rosettas i Hornstull.
      </p>

      <div class="time-place">
        <p><strong>När:</strong> Fredag kl. 17:30</p>
        <p><strong>Var:</strong> Rosettas, Hornstull</p>
      </div>

      <p class="names">Bara vi, god mat och en kväll som är helt din.</p>
    </div>
  </section>
</body>
</html>
