<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SL Hållplatsscanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #e8304a;
    }
    p.sub { font-size: 0.85rem; color: #aaa; margin-bottom: 16px; text-align: center; }

    #videoWrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #e8304a;
    }
    video { width: 100%; display: block; }

    /* Siktlinje */
    #overlay {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 80%;
      height: 60px;
      transform: translateY(-50%);
      border: 2px solid rgba(232,48,74,0.8);
      border-radius: 6px;
      background: rgba(232,48,74,0.05);
      pointer-events: none;
    }
    #overlayLabel {
      position: absolute;
      bottom: -22px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      color: #e8304a;
    }

    canvas { display: none; }

    button {
      margin-top: 24px;
      width: 100%;
      max-width: 420px;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #e8304a;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }

    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      min-height: 20px;
    }

    #result {
      margin-top: 18px;
      width: 100%;
      max-width: 420px;
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      display: none;
    }
    #result h2 { font-size: 1rem; color: #e8304a; margin-bottom: 10px; }
    #stopCode { font-size: 2rem; font-weight: bold; letter-spacing: 4px; color: #fff; }
    #stopName { font-size: 1rem; color: #ccc; margin-top: 4px; }
    #departures { margin-top: 12px; }
    .dep {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4a;
      font-size: 0.9rem;
    }
    .dep:last-child { border-bottom: none; }
    .dep .line { background: #e8304a; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .dep .time { color: #7ec8e3; font-weight: bold; }

    #manualWrap {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 8px;
    }
    #manualInput {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #16213e;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
    }
    #manualBtn {
      margin-top: 0;
      width: auto;
      padding: 12px 16px;
      flex-shrink: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>🚌 SL Hållplatsscanner</h1>
<p class="sub">Rikta kameran mot hållplatsnumret och tryck "Scanna"</p>

<div id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay"><span id="overlayLabel">Rikta mot sifferkoden</span></div>
</div>

<canvas id="canvas"></canvas>

<button id="scanBtn">📷 Scanna hållplats</button>
<div id="status">Startar kamera…</div>

<div id="result">
  <h2>Hittad hållplats</h2>
  <div id="stopCode">—</div>
  <div id="stopName"></div>
  <div id="departures"></div>
</div>

<div id="manualWrap">
  <input id="manualInput" type="number" placeholder="Skriv kod" maxlength="6" />
  <button id="manualBtn">Sök</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const scanBtn = document.getElementById('scanBtn');
const status = document.getElementById('status');
const resultDiv = document.getElementById('result');
const stopCodeEl = document.getElementById('stopCode');
const stopNameEl = document.getElementById('stopName');
const departuresEl = document.getElementById('departures');
const manualInput = document.getElementById('manualInput');
const manualBtn = document.getElementById('manualBtn');

// Starta kamera
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    status.textContent = 'Kamera redo. Rikta mot hållplatsnumret.';
  } catch (e) {
    status.textContent = '❌ Kunde inte starta kameran: ' + e.message;
  }
}

// Capture + OCR
async function scanFrame() {
  scanBtn.disabled = true;
  status.textContent = '🔍 Analyserar bild…';

  // Rita frame till canvas
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  // Crop till mitten (siktlinjen)
  const cropY = canvas.height * 0.35;
  const cropH = canvas.height * 0.30;
  const cropX = canvas.width * 0.1;
  const cropW = canvas.width * 0.8;

  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = cropW;
  cropCanvas.height = cropH;
  const cctx = cropCanvas.getContext('2d');
  cctx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  // Kontrast-förstärkning
  const imgData = cctx.getImageData(0, 0, cropW, cropH);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const avg = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
    const v = avg > 128 ? 255 : 0;
    imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = v;
  }
  cctx.putImageData(imgData, 0, 0);

  try {
    const result = await Tesseract.recognize(cropCanvas, 'eng', {
      tessedit_char_whitelist: '0123456789',
      psm: 7
    });

    const text = result.data.text.trim().replace(/\D/g, '');
    const match = text.match(/\d{4,6}/);

    if (match) {
      const code = match[0];
      status.textContent = `✅ Kod hittad: ${code}`;
      await fetchDepartures(code);
    } else {
      status.textContent = '⚠️ Ingen kod hittades. Försök igen.';
    }
  } catch (e) {
    status.textContent = '❌ OCR-fel: ' + e.message;
  }

  scanBtn.disabled = false;
}

// Hämta avgångar via SL Trafiklab (öppen endpoint utan API-nyckel)
async function fetchDepartures(siteId) {
  stopCodeEl.textContent = siteId;
  resultDiv.style.display = 'block';
  stopNameEl.textContent = 'Hämtar avgångar…';
  departuresEl.innerHTML = '';

  // SL Transport API (öppen, ingen nyckel krävs för grunddata)
  const url = `https://transport.integration.sl.se/v1/sites/${siteId}/departures?forecast=30`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const deps = data.departures || [];
    if (deps.length === 0) {
      stopNameEl.textContent = 'Hållplats ' + siteId;
      departuresEl.innerHTML = '<div style="color:#aaa;font-size:0.85rem">Inga avgångar hittades.</div>';
      return;
    }

    // Hållplatsnamn från första avgången
    const name = deps[0]?.stop_point?.designation || '';
    stopNameEl.textContent = deps[0]?.line?.group_of_lines || ('Hållplats ' + siteId);

    // Visa upp till 6 avgångar
    const shown = deps.slice(0, 6);
    departuresEl.innerHTML = shown.map(d => {
      const lineName = d.line?.designation || '?';
      const dest = d.destination || '';
      const display = d.display || '';
      return `<div class="dep">
        <span><span class="line">${lineName}</span> ${dest}</span>
        <span class="time">${display}</span>
      </div>`;
    }).join('');

  } catch (e) {
    stopNameEl.textContent = 'Hållplats ' + siteId;
    departuresEl.innerHTML = `<div style="color:#aaa;font-size:0.85rem">Kunde inte hämta avgångar.<br>Prova: <a href="https://sl.se" style="color:#7ec8e3">sl.se</a></div>`;
  }
}

scanBtn.addEventListener('click', scanFrame);
manualBtn.addEventListener('click', () => {
  const code = manualInput.value.trim();
  if (code.length >= 4) fetchDepartures(code);
});
manualInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') manualBtn.click();
});

startCamera();
</script>
</body>
</html>
